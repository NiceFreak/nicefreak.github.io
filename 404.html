<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#080808" />
    <meta name="robots" content="noindex" />
    <title>页面未找到 / 페이지를 찾을 수 없습니다</title>
    <style>
      :root {
        color: #f5f5f5;
        background: #080808;
        font-family: Arial, "Noto Sans KR", "Noto Sans SC", sans-serif;
      }

      body {
        display: grid;
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        place-items: center;
      }

      main {
        width: min(34rem, calc(100% - 3rem));
      }

      h1 {
        margin: 0 0 1rem;
        font-size: clamp(1.5rem, 5vw, 2.5rem);
        line-height: 1.2;
      }

      p {
        margin: 0.5rem 0;
        color: #b8b8b8;
        line-height: 1.65;
      }

      a {
        color: #8ca8ff;
      }

      [hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>页面未找到 / 페이지를 찾을 수 없습니다</h1>
      <p id="status" role="status">
        您访问的页面不存在或尚未发布。 / 요청하신 페이지가 없거나 아직 게시되지
        않았습니다.
      </p>
      <p id="home-link"><a href="/">返回首页 / 홈으로 돌아가기</a></p>
    </main>
    <script>
      (() => {
        const assetPath = "assets/index-BPnJDcvI.js";
        const status = document.getElementById("status");
        const homeLink = document.getElementById("home-link");
        const pathParts = window.location.pathname.split("/").filter(Boolean);
        const hasTrailingSlash =
          pathParts.length > 0 && window.location.pathname.endsWith("/");
        const normalizedPath = `/${pathParts.join("/")}${
          hasTrailingSlash ? "/" : ""
        }`;

        const candidateRoots = [];
        for (let length = pathParts.length; length >= 0; length -= 1) {
          const candidate = `/${pathParts.slice(0, length).join("/")}`;
          candidateRoots.push(candidate === "/" ? candidate : `${candidate}/`);
        }

        status.textContent =
          "正在确认页面地址，请稍候。 / 페이지 주소를 확인하고 있습니다. 잠시만 기다려 주세요.";
        status.setAttribute("aria-busy", "true");
        homeLink.hidden = true;

        const findPublishedRoot = async () => {
          for (const rootPath of candidateRoots) {
            const assetUrl = new URL(
              `${rootPath}${assetPath}`,
              window.location.origin,
            );
            try {
              const response = await fetch(assetUrl, {
                method: "HEAD",
                cache: "no-store",
              });
              const responseUrl = new URL(response.url);
              const isExpectedAsset =
                responseUrl.origin === window.location.origin &&
                responseUrl.pathname === assetUrl.pathname;
              if (response.ok && isExpectedAsset) {
                return rootPath;
              }
            } catch {
              // Continue upward when a candidate cannot be reached.
            }
          }
          return null;
        };

        findPublishedRoot()
          .then((rootPath) => {
            if (rootPath === null) {
              throw new Error("published_root_not_found");
            }

            const rootPrefix = rootPath === "/" ? "" : rootPath.slice(0, -1);
            const relativePath = normalizedPath.slice(rootPrefix.length);
            const routePath = relativePath.startsWith("/")
              ? relativePath
              : `/${relativePath}`;
            const route = `${routePath}${window.location.search}${window.location.hash}`;
            const target = new URL(rootPath, window.location.origin);
            const isSafeRoute =
              routePath.startsWith("/") && !routePath.startsWith("//");
            const isSafeTarget =
              target.origin === window.location.origin &&
              target.pathname.startsWith("/") &&
              !target.pathname.startsWith("//");
            if (!isSafeRoute || !isSafeTarget) {
              throw new Error("unsafe_redirect_target");
            }

            target.searchParams.set("__community_route", route);
            window.location.replace(target.href);
          })
          .catch(() => {
            status.textContent =
              "您访问的页面不存在或尚未发布。 / 요청하신 페이지가 없거나 아직 게시되지 않았습니다.";
            status.removeAttribute("aria-busy");
            homeLink.hidden = false;
          });
      })();
    </script>
  </body>
</html>
