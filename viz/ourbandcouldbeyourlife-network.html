<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>可视化关系网络 - 我们的乐队也可以成为你的生活</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0e0e0e;
    color: #e8e4dc;
    font-family: 'Courier New', monospace;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
  }

  #header {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 10;
    padding: 16px 24px;
    display: flex;
    align-items: baseline;
    gap: 16px;
    background: linear-gradient(to bottom, #0e0e0e 60%, transparent);
    pointer-events: none;
  }
  #header h1, #header span { pointer-events: none; }

  #header h1 {
    font-size: 13px;
    font-weight: normal;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #e8e4dc;
  }

  #header span {
    font-size: 11px;
    color: #555;
    letter-spacing: 0.05em;
  }

  #legend {
    position: fixed;
    top: 56px; left: 24px;
    z-index: 10;
    display: flex;
    flex-direction: column;
    gap: 6px;
    pointer-events: auto;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 10px;
    letter-spacing: 0.1em;
    color: #777;
    text-transform: uppercase;
    cursor: pointer;
    transition: color 0.2s;
  }

  .legend-item:hover { color: #e8e4dc; }
  .legend-item.off { opacity: 0.4; }
  .legend-item.off .legend-dot { background: #444 !important; }
  .legend-item.off span, .legend-item.off { text-decoration: line-through; }

  .legend-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  #focus-panel {
    position: fixed;
    right: 24px; bottom: 132px;
    z-index: 10;
    width: min(240px, calc(100vw - 48px));
    background: rgba(18,18,18,0.82);
    border: 1px solid #2a2a2a;
    padding: 12px;
    display: none;
    flex-direction: column;
    gap: 10px;
    pointer-events: auto;
    backdrop-filter: blur(6px);
  }
  #focus-panel.show { display: flex; }

  #focus-panel .fp-name {
    font-size: 13px;
    color: #e8e4dc;
    letter-spacing: 0.05em;
    line-height: 1.35;
  }

  #focus-panel .fp-type {
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.15em;
  }

  #focus-panel .fp-identity {
    display: flex;
    flex-direction: column;
    gap: 7px;
  }

  #focus-panel .fp-identity.empty {
    display: none;
  }

  #focus-panel .fp-summary {
    color: #d4cfc5;
    font-size: 11px;
    line-height: 1.45;
    letter-spacing: 0.03em;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  #focus-panel .fp-facts {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
  }

  #focus-panel .fp-fact {
    border: 1px solid #303030;
    background: #151515;
    color: #8e887e;
    font-size: 9px;
    line-height: 1;
    letter-spacing: 0.03em;
    padding: 5px 6px;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  #focus-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .rel-chip {
    appearance: none;
    border: 1px solid #333;
    background: #171717;
    color: #888;
    font-family: inherit;
    font-size: 10px;
    letter-spacing: 0.04em;
    line-height: 1;
    padding: 7px 8px;
    cursor: pointer;
    transition: all 0.15s;
  }

  .rel-chip:hover {
    color: #e8e4dc;
    border-color: #555;
    background: #222;
  }

  .rel-chip.active {
    color: #e8e4dc;
    border-color: currentColor;
    background: #24211b;
  }

  .rel-chip:disabled {
    color: #4a4a4a;
    border-color: #262626;
    background: #111;
    cursor: default;
    opacity: 0.65;
  }

  #controls {
    position: fixed;
    bottom: 24px; right: 24px;
    z-index: 10;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .ctrl-btn {
    width: 32px; height: 32px;
    background: #1a1a1a;
    border: 1px solid #333;
    color: #888;
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
    font-family: monospace;
  }

  .ctrl-btn:hover {
    background: #252525;
    color: #e8e4dc;
    border-color: #555;
  }

  #info {
    position: fixed;
    bottom: 24px; left: 24px;
    z-index: 10;
    font-size: 10px;
    color: #666;
    letter-spacing: 0.08em;
    line-height: 1.8;
    max-width: min(520px, calc(100vw - 120px));
  }

  #info .info-source {
    color: #444;
  }

  svg { width: 100%; height: 100%; }

  .node { cursor: pointer; }
  .node circle { transition: r 0.2s; }
  .node:hover circle { }
  .node text { pointer-events: none; }
  .node .micro-label {
    fill: #777;
    font-size: 7.5px;
    letter-spacing: 0.04em;
    opacity: 0.72;
  }
  .node.highlighted .micro-label,
  .node.focus-center .micro-label {
    fill: #a8a197;
    opacity: 0.88;
  }
  .node .micro-interpretation {
    pointer-events: none;
  }
  .node .micro-interpretation text {
    fill: #d4cfc5;
    font-size: 8px;
    letter-spacing: 0.02em;
    opacity: 0.86;
    paint-order: stroke;
    stroke: rgba(14,14,14,0.88);
    stroke-width: 2.5px;
    stroke-linejoin: round;
  }
  .node .micro-interpretation .line-2 {
    fill: #a59d92;
    opacity: 0.76;
  }

  .link {
    stroke-opacity: 0.22;
    transition: stroke-opacity 0.2s;
  }

  .link.highlighted { stroke-opacity: 0.95; }
  .link.step-trace {
    stroke-opacity: 0.72;
    stroke-dasharray: 5,3;
  }
  .link.path-hint {
    stroke-opacity: 0.16;
    stroke-dasharray: 2,5;
  }
  .link.dimmed { stroke-opacity: 0.04; }
  .node.dimmed { opacity: 0.12; }
  .node.second-hop { opacity: 0.34; }
  .node.highlighted { opacity: 1; }
  .node.previous-node { opacity: 0.58; }
  .node.second-hop circle.dot {
    stroke-opacity: 0.42;
    stroke-width: 1.3;
  }
  .node.previous-node circle.dot {
    stroke-opacity: 0.68;
    stroke-width: 1.6;
    stroke-dasharray: 2,3;
  }
  .node.previous-node .node-name {
    fill: #9b958b;
  }
  .node.second-hop .micro-label {
    opacity: 0.48;
  }
  .node.focus-center circle.dot {
    stroke-opacity: 1;
    stroke-width: 2.6;
    filter: url(#glow);
  }
  .node.neighbor circle.dot {
    stroke-opacity: 0.72;
    stroke-width: 2;
  }

  /* 场景叠加面板 */
  #scene-panel {
    position: fixed;
    top: 56px; right: 24px;
    z-index: 10;
    width: 180px;
    max-height: calc(100vh - 110px);
    overflow-y: auto;
    background: rgba(20,20,20,0.85);
    border: 1px solid #2a2a2a;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    -webkit-overflow-scrolling: touch;
  }

  #scene-title {
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #777;
    margin-bottom: 2px;
    cursor: pointer;
    user-select: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  #scene-title::after { content: '▾'; font-size: 9px; color: #777; }
  #scene-panel.collapsed #scene-title { margin-bottom: 0; }
  #scene-panel.collapsed #scene-title::after { content: '▸'; }
  #scene-panel.collapsed #scene-list,
  #scene-panel.collapsed #scene-clear { display: none; }

  #scene-list {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .scene-btn {
    width: 100%;
    text-align: left;
    background: #1a1a1a;
    border: 1px solid #333;
    color: #999;
    font-family: inherit;
    font-size: 10px;
    letter-spacing: 0.03em;
    line-height: 1.4;
    padding: 6px 8px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .scene-btn:hover { background: #252525; color: #e8e4dc; border-color: #555; }
  .scene-btn.active {
    background: #2a2419;
    color: #c9a94e;
    border-color: #c9a94e;
  }

  #scene-clear {
    font-size: 10px;
    letter-spacing: 0.05em;
    color: #666;
    cursor: pointer;
    padding-top: 4px;
    user-select: none;
  }
  #scene-clear:hover { color: #e05c3a; }

  /* 场景高亮状态 */
  .node.scene-dim { opacity: 0.12; }
  .node.scene-lit circle { filter: url(#glow); }

  /* 触屏与缩放 */
  svg { touch-action: none; }

  /* ── 移动端适配 ── */
  @media (max-width: 768px) {
    #header { padding: 10px 14px; flex-direction: column; gap: 2px; align-items: flex-start; }
    #header h1 { font-size: 11px; letter-spacing: 0.08em; line-height: 1.3; }
    /* 移动端隐藏冗长的操作提示，保持顶栏紧凑、不与场景面板重叠 */
    #header span { display: none; }

    #legend {
      top: auto; bottom: 70px; left: 12px;
      flex-direction: row; flex-wrap: wrap;
      gap: 6px 12px;
      max-width: calc(100vw - 24px);
      background: rgba(14,14,14,0.7);
      padding: 6px 8px;
    }
    .legend-item { font-size: 9px; }

    /* 移动端：场景面板改为左上角可折叠下拉，默认收起 */
    #scene-panel {
      top: 60px; bottom: auto; left: 12px; right: auto;
      width: auto; min-width: 148px; max-width: calc(100vw - 90px);
      max-height: none;
      background: rgba(18,18,18,0.95);
    }
    #scene-list {
      flex-direction: column; flex-wrap: nowrap;
      max-height: 52vh; overflow-y: auto; overflow-x: visible;
      margin-top: 6px;
    }
    .scene-btn { flex: none; min-width: 0; width: 100%; font-size: 11px; padding: 9px 10px; }
    #scene-title { font-size: 11px; }
    #scene-clear { align-self: flex-start; font-size: 11px; padding: 8px 2px 2px; }

    #controls { bottom: auto; top: 12px; right: 12px; gap: 8px; }
    .ctrl-btn { width: 40px; height: 40px; font-size: 20px; }

    #info { bottom: 12px; left: 12px; font-size: 9px; z-index: 5; max-width: calc(100vw - 24px); }

    #focus-panel {
      top: 112px; bottom: auto; left: 12px; right: 72px;
      width: auto;
      padding: 10px;
    }
    .rel-chip { font-size: 10px; padding: 8px; }

    .node text { font-size: 11px; }
  }

  /* 隐藏滚动条但保留滚动 */
  #scene-panel::-webkit-scrollbar { width: 6px; height: 6px; }
  #scene-panel::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
</style>
</head>
<body>

<div id="header">
  <h1>Our Band Could Be Your Life — 关系网络</h1>
</div>

<div id="legend"></div>
<div id="scene-panel"><div id="scene-title">场景叠加</div><div id="scene-list"></div><div id="scene-clear" onclick="clearScene()">清除 ×</div></div>

<div id="focus-panel">
  <div class="fp-name" id="focus-name"></div>
  <div class="fp-type" id="focus-type"></div>
  <div class="fp-identity empty" id="focus-identity">
    <div class="fp-summary" id="focus-summary"></div>
    <div class="fp-facts" id="focus-facts"></div>
  </div>
  <div id="focus-chips"></div>
</div>

<div id="controls">
  <button class="ctrl-btn" id="btn-zoom-in">+</button>
  <button class="ctrl-btn" id="btn-zoom-out">−</button>
  <button class="ctrl-btn" id="btn-reset" title="重置视角">⌂</button>
</div>

<div id="info">
  <span id="view-summary">—</span> &nbsp;·&nbsp; <span class="info-source">数据源 v2</span>
</div>

<svg id="svg">
  <defs>
    <filter id="glow" x="-120%" y="-120%" width="340%" height="340%" filterUnits="objectBoundingBox">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g id="root"></g>
</svg>

<script>
// ── 调色板 ──
const COLORS = {
  Band:    '#e05c3a',  // 乐队 — 砖红

  City:    '#7ab87a',  // 城市 — 绿
  Project: '#a07cc5',  // 组织/项目 — 紫
  Venue:   '#4fa8a0',  // 场地 — 青
  Event:   '#cf6f8f',  // 事件 — 玫红
};

const LINK_COLORS = {
  membership:   '#5b9bd5',
  affiliation:  '#c9a94e',
  location_of:  '#7ab87a',
  collaboration:'#aaa',
  succession:   '#c9a94e',
  family:       '#e05c3a',
  identity:     '#a07cc5',
  appearance:   '#cf6f8f',  // 共同出现 / 演出
};

// ── 数据 ──
// ── 数据：由《Our Band Could Be Your Life》关系收集表自动生成 ──

const relationLabels = {
  membership: '成员',

  location_of: '地点',
  collaboration: '合作',
  succession: '前身/后继',
  appearance: '出现',

function formatLabel(type, value) {
  if (type === 'type') return typeLabels[value] || String(value || '');
  if (type === 'relation') return relationLabels[value] || String(value || '');
  if (type === 'place') return String(value || '').replace(/\(/g, '（').replace(/\)/g, '）');
  if (type === 'time') return `${value}年代`;
  if (type === 'style') return String(value || '');
  return String(value || '');
}
const relationTypes = ['membership', 'affiliation', 'location_of', 'collaboration', 'succession', 'appearance'];

function isNodeVisible(d) {
  const inType = !hiddenTypes.has(d.type);
  const inScene = !activeScene || (activeScene.nodes || []).includes(d.id);
  return inType && inScene;
}

function isLinkVisible(l) {
  const source = l.source.id ? l.source : nodeById.get(l.source);
  const target = l.target.id ? l.target : nodeById.get(l.target);
  if (!source || !target) return false;
  if (hiddenTypes.has(source.type) || hiddenTypes.has(target.type)) return false;
  if (activeScene) {
    const ids = new Set(activeScene.nodes || []);
    if (!ids.has(source.id) || !ids.has(target.id)) return false;
  }
  return true;
}

function updateViewSummary() {
  const visibleNodes = filteredNodes.filter(isNodeVisible).length;
  const visibleLinks = filteredLinks.filter(isLinkVisible).length;
  const parts = [activeScene ? activeScene.label : '全图'];
  if (activeNode) parts.push(`焦点：${activeNode.label}`);
  if (activeRelationType) parts.push(`关系：${formatLabel('relation', activeRelationType)}`);
  const hidden = [...hiddenTypes].map(type => formatLabel('type', type));
  if (hidden.length) parts.push(`隐藏：${hidden.join('、')}`);
  parts.push(`${visibleNodes} 个实体`);
  parts.push(`${visibleLinks} 条关系`);
  viewSummaryEl.textContent = parts.join(' · ');
}

  if (!l || !filteredIds.has(l.source) || !filteredIds.has(l.target)) {
    if (l) droppedLinks.push(l);
    return;
  }
  const key = l.source + '>' + l.target + ':' + l.type;
  const existing = linkByKey.get(key);
  if (!existing) {
    linkByKey.set(key, { ...l });
    return;
  }
  if (l.label && !existing.label.includes(l.label)) existing.label += '；' + l.label;
});
const filteredLinks = Array.from(linkByKey.values());
if (droppedLinks.length) {
  console.warn('[network data] dropped links with missing endpoints:', droppedLinks);
}
const sceneNodeWarnings = scenes
  .map(sc => ({ scene: sc.id, missing: (sc.nodes || []).filter(id => !filteredIds.has(id)) }))
  .filter(sc => sc.missing.length);
if (sceneNodeWarnings.length) {
  console.warn('[network data] scenes reference missing nodes:', sceneNodeWarnings);
}

const sim = d3.forceSimulation(filteredNodes)
  .force('link', d3.forceLink(filteredLinks).id(d => d.id).distance(d => {
    if (d.type === 'location_of') return 140;
    if (d.type === 'membership') return 80;
    if (d.type === 'affiliation') return 100;
    if (d.type === 'appearance') return 70;
    return 120;
  }).strength(d => {
    if (d.type === 'location_of') return 0.3;
    if (d.type === 'membership') return 0.9;
    if (d.type === 'appearance') return 0.5;
    return 0.6;
  }))
  // 节点数量大幅增加（150+），加大斥力让网络铺得更开、减少重叠
  .force('charge', d3.forceManyBody().strength(d => {
    if (d.type === 'City') return -520;
    if (d.type === 'Label') return -560;
    if (d.type === 'Band') return -320;
    return -200;
  }))
  .force('center', d3.forceCenter(width / 2, height / 2))
  // 轻微向心力：把松散连接 / 不相连的子图（如波士顿 Mission of Burma 一支）拉回画面中心附近
  .force('x', d3.forceX(width / 2).strength(0.05))
  .force('y', d3.forceY(height / 2).strength(0.05))
  .force('collision', d3.forceCollide().radius(d => nodeRadius(d) + 14));

// 节点半径：移动端整体略放大，便于辨识与点按
function nodeRadius(d) {
  const m = isMobile() ? 1.15 : 1;
  if (d.type === 'Label') return 18 * m;
  if (d.type === 'City') return 14 * m;
  if (d.type === 'Band') return 12 * m;
  if (d.type === 'Venue') return 10 * m;
  if (d.type === 'Event') return 7 * m;
  return 9 * m;
}

// 连线
const linkEl = root.append('g')
  .selectAll('line')
  .data(filteredLinks)
  .join('line')
  .attr('class', 'link')
  .attr('stroke', d => LINK_COLORS[d.type] || '#666')
  .attr('stroke-width', d => d.type === 'membership' ? 1.5 : d.type === 'location_of' ? 0.8 : d.type === 'appearance' ? 0.9 : 1.2)
  .attr('stroke-dasharray', d => d.type === 'location_of' ? '3,4' : d.type === 'succession' ? '6,3' : d.type === 'appearance' ? '1,3' : null);

// 节点
const nodeEl = root.append('g')
  .selectAll('g')
  .data(filteredNodes)
  .join('g')
  .attr('class', 'node')
  .call(d3.drag()
    .on('start', (e, d) => { if (!e.active) sim.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
    .on('drag',  (e, d) => { d.fx = e.x; d.fy = e.y; })
    .on('end',   (e, d) => { if (!e.active) sim.alphaTarget(0); d.fx = null; d.fy = null; })
  );

// 透明热区圆：扩大可点按/悬停范围（移动端尤其重要，手指比鼠标粗）
nodeEl.append('circle')
  .attr('class', 'hit')
  .attr('r', d => nodeRadius(d) + (isMobile() ? 16 : 8))
  .attr('fill', 'transparent');

nodeEl.append('circle')
  .attr('class', 'dot')
  .attr('r', nodeRadius)
  .attr('fill', d => COLORS[d.type] || '#888')
  .attr('fill-opacity', 0.72)
  .attr('stroke', d => COLORS[d.type] || '#888')
  .attr('stroke-width', 1.5)
  .attr('stroke-opacity', 0.28);

// 标签精简：缩得太小看不清时，只保留「锚点」类标签（城市/厂牌/乐队），放大后再显示全部
// 这样移动端聚焦局部时标签清晰可读，缩放总览时又不会糊成一团
const ANCHOR_LABEL = new Set(['City', 'Label', 'Band']);
let highlightOn = false;
function applyLabelVisibility(scale) {
  if (scale == null) scale = d3.zoomTransform(svg.node()).k;
  const showMinor = scale >= 0.55;
  const showMicro = scale >= 0.9;
  nodeEl.selectAll('text.node-name').style('display', n => (showMinor || ANCHOR_LABEL.has(n.type)) ? null : 'none');
  nodeEl.selectAll('text.micro-label').style('display', n => showMicro ? null : 'none');
}

nodeEl.append('text')
  .attr('class', 'node-name')
  .text(d => d.label)
  .attr('dy', d => nodeRadius(d) + 11)
  .attr('text-anchor', 'middle')
  .attr('font-size', d => d.type === 'Label' ? (isMobile() ? 11 : 10) : (isMobile() ? 10 : 9))
  .attr('fill', d => d.type === 'City' ? '#7ab87a' : '#b0aaa0')
  .attr('letter-spacing', '0.04em');

function rawEndpointId(endpoint) {
  return endpoint && endpoint.id ? endpoint.id : endpoint;
}

function firstStyleAnchor(detail = '') {
  const stylePart = detail.split('｜')[1];
  if (!stylePart) return '';
  const style = stylePart.split(/[\/／、,，]/)[0].trim().replace(/\s+/g, ' ');
  return formatLabel('style', style);
}

function decadeAnchor(text = '') {
  const decade = text.match(/\b(19[789]0s|20[012]0s)\b/i);
  if (decade) return formatLabel('time', decade[1].replace(/s$/i, ''));
  const year = text.match(/\b(19[7-9]\d|20[0-2]\d)\b/);
  return year ? formatLabel('time', Math.floor(Number(year[1]) / 10) * 10) : '';
}

function placeAnchorFromNodeId(id) {
  const node = nodeById.get(id);
  return node ? formatLabel('place', node.label) : '';
}

function directCityAnchor(id) {
  const link = filteredLinks.find(l => l.type === 'location_of' && (rawEndpointId(l.source) === id || rawEndpointId(l.target) === id));
  if (!link) return '';
  const otherId = rawEndpointId(link.source) === id ? rawEndpointId(link.target) : rawEndpointId(link.source);
  return placeAnchorFromNodeId(otherId);
}

function indirectCityAnchor(d) {
  if (d.type !== 'Person') return '';
  const membership = filteredLinks.find(l => l.type === 'membership' && (rawEndpointId(l.source) === d.id || rawEndpointId(l.target) === d.id));
  if (!membership) return '';
  const otherId = rawEndpointId(membership.source) === d.id ? rawEndpointId(membership.target) : rawEndpointId(membership.source);
  return directCityAnchor(otherId);
}

function microContextLabel(d) {
  const type = formatLabel('type', d.type);
  const anchor = d.type === 'City'
    ? placeAnchorFromNodeId(d.id)
    : firstStyleAnchor(d.detail) || directCityAnchor(d.id) || indirectCityAnchor(d) || decadeAnchor(`${d.label} ${d.detail || ''}`);
  const label = anchor ? `${type} · ${anchor}` : type;
  return label.length > 18 ? `${label.slice(0, 15)}...` : label;
}

function cleanPhrase(text) {
  return String(text || '')
    .replace(/\s+/g, ' ')
    .replace(/^[：:，,、\s]+|[。；;，,\s]+$/g, '')
    .trim();
}

function fieldValue(d, keys) {
  for (const key of keys) {
    const value = d && d[key];
    if (value == null || value === '') continue;
    return cleanPhrase(value);
  }
  return '';
}

function splitValues(value) {
  return String(value || '')
    .split(/[、,，;；/／|｜]+/)
    .map(cleanPhrase)
    .filter(Boolean);
}

function uniqueCompact(items) {
  const seen = new Set();
  return items.map(cleanPhrase).filter(item => {
    if (!item) return false;
    const key = item.toLowerCase();
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  });
}

function otherNodeForLink(d, l) {
  const sourceId = rawEndpointId(l.source);
  const targetId = rawEndpointId(l.target);
  if (sourceId !== d.id && targetId !== d.id) return null;
  return nodeById.get(sourceId === d.id ? targetId : sourceId) || null;
}

function relationLinks(d, type) {
  return filteredLinks.filter(l =>
    (!type || l.type === type) &&
    (rawEndpointId(l.source) === d.id || rawEndpointId(l.target) === d.id)
  );
}

function relatedNodes(d, type, nodeType) {
  const nodesForType = relationLinks(d, type)
    .map(l => otherNodeForLink(d, l))
    .filter(n => n && (!nodeType || n.type === nodeType));
  const seen = new Set();
  return nodesForType.filter(n => {
    if (seen.has(n.id)) return false;
    seen.add(n.id);
    return true;
  });
}

function relatedNames(d, type, nodeType) {
  return relatedNodes(d, type, nodeType).map(n => n.label);
}

function sceneAnchor(d) {
  const explicit = fieldValue(d, ['章节来源', 'chapterSource', 'chapter_source', 'sourceChapter', 'source']);
  if (explicit) return explicit;
  const scene = scenes.find(sc => (sc.nodes || []).includes(d.id));
  return scene ? cleanPhrase(scene.label) : '';
}

function chapterAnchor(d) {
  const explicit = fieldValue(d, ['章节', 'chapterName', 'chapterTitle']);
  if (explicit) return explicit;
  if (d.chapter === 0) return '引言';
  return d.chapter ? `第${d.chapter}章` : '';
}

function detailSegments(d) {
  const explicit = fieldValue(d, ['一句话简介', '简介', 'summary', 'intro', 'description', '备注', 'notes', 'note']);
  const text = explicit || String(d.detail || '').split('｜')[0];
  return text.split(/[；。]/).map(cleanPhrase).filter(Boolean);
}

function summaryAnchor(d) {
  const segments = detailSegments(d);
  return segments.find(s => !/^(创始人|联合创始人|旗下|成员|位于|大本营)[：:]/.test(s)) || '';
}

function styleAnchors(d) {
  const explicit = []
    .concat(splitValues(fieldValue(d, ['主风格', 'mainStyle', 'main_style', 'primaryStyle', 'primary_style', 'primaryGenre', 'primary_genre', 'genre', 'style'])))
    .concat(splitValues(fieldValue(d, ['次风格', 'secondaryStyle', 'secondary_style', 'secondaryGenre', 'secondary_genre', 'subGenre', 'sub_genre'])));
  const detailStyle = String(d.detail || '').split('｜')[1] || '';
  return uniqueCompact(explicit.concat(splitValues(detailStyle))).map(s => formatLabel('style', s)).slice(0, 2);
}

function cityThroughRelatedEntity(d) {
  const carriers = []
    .concat(relatedNodes(d, 'membership', 'Band'))
    .concat(relatedNodes(d, 'affiliation', 'Band'))
    .concat(relatedNodes(d, 'collaboration', 'Band'))
    .concat(relatedNodes(d, 'appearance', 'Venue'));
  for (const node of carriers) {
    const city = directCityAnchor(node.id);
    if (city) return city;
  }
  return '';
}

function cityAnchor(d) {
  const explicit = fieldValue(d, ['城市', 'city', 'homeCity', 'home_city', 'baseCity', 'base_city', 'location']);
  if (explicit) return formatLabel('place', explicit);
  if (d.type === 'City') return placeAnchorFromNodeId(d.id);
  return directCityAnchor(d.id) || indirectCityAnchor(d) || cityThroughRelatedEntity(d);
}

function labelAnchors(d) {
  const explicit = splitValues(fieldValue(d, ['签约厂牌', '厂牌信息', '厂牌', 'recordLabel', 'record_label', 'labelName', 'label_name']));
  const linked = relatedNames(d, 'affiliation', 'Label');
  const self = d.type === 'Label' ? [d.label] : [];
  return uniqueCompact(self.concat(explicit, linked)).slice(0, 2);
}

function roleBandAnchors(d) {
  return uniqueCompact(
    relatedNames(d, 'membership', 'Band')
      .concat(relatedNames(d, 'affiliation', 'Band'))
      .concat(relatedNames(d, 'appearance', 'Band'))
  ).slice(0, 3);
}

function collaborationAnchors(d) {
  return uniqueCompact(
    relatedNames(d, 'collaboration')
      .concat(relatedNames(d, 'appearance').filter(name => name !== d.label))
  ).slice(0, 3);
}

function localEntityAnchors(d) {
  if (d.type !== 'City') return [];
  return uniqueCompact(
    relatedNames(d, 'location_of', 'Band')
      .concat(relatedNames(d, 'location_of', 'Label'))
      .concat(relatedNames(d, 'location_of', 'Venue'))
  ).slice(0, 3);
}

function successionAnchors(d) {
  const predecessors = [];
  const successors = [];
  relationLinks(d, 'succession').forEach(l => {
    const sourceId = rawEndpointId(l.source);
    const targetId = rawEndpointId(l.target);
    if (targetId === d.id && nodeById.has(sourceId)) predecessors.push(nodeById.get(sourceId).label);
    if (sourceId === d.id && nodeById.has(targetId)) successors.push(nodeById.get(targetId).label);
  });
  return {
    predecessors: uniqueCompact(predecessors).slice(0, 2),
    successors: uniqueCompact(successors).slice(0, 2),
  };
}

function rosterAnchors(d) {
  if (d.type !== 'Label') return [];
  const fromLinks = relatedNames(d, 'affiliation', 'Band');
  const fromDetail = (String(d.detail || '').match(/旗下[：:]\s*([^；]+)/) || [])[1];
  return uniqueCompact(fromLinks.concat(splitValues(fromDetail))).slice(0, 3);
}

function joinNames(items, limit = 2) {
  return uniqueCompact(items).slice(0, limit).join('、');
}

function compactLine(line, maxLength = 38) {
  const text = cleanPhrase(line);
  if (text.length <= maxLength) return text;
  return `${text.slice(0, maxLength - 1)}…`;
}

function compactFact(line, maxLength = 24) {
  const text = cleanPhrase(line);
  if (text.length <= maxLength) return text;
  return `${text.slice(0, maxLength - 1)}…`;
}

function isIdentitySignal(segment) {
  const text = cleanPhrase(segment);
  return text.length > 1 && /[\p{Script=Han}A-Za-z]/u.test(text);
}

function fieldGroundedFacts(d) {
  const succession = successionAnchors(d);
  return {
    type: formatLabel('type', d.type),
    city: cityAnchor(d),
    scene: sceneAnchor(d),
    chapter: chapterAnchor(d),
    styles: styleAnchors(d),
    labels: labelAnchors(d),
    bands: roleBandAnchors(d),
    localEntities: localEntityAnchors(d),
    roster: rosterAnchors(d),
    collaborators: collaborationAnchors(d),
    predecessors: succession.predecessors,
    successors: succession.successors,
    summary: summaryAnchor(d),
  };
}

function identitySummary(d) {
  const segments = detailSegments(d).filter(isIdentitySignal);
  const important = segments.filter(s => !/^(创始人|联合创始人|旗下|成员|位于|大本营)[：:]/.test(s));
  const picked = d.type === 'Label' && important.length ? important.slice(0, 2) : segments.slice(0, 2);
  if (picked.length) return compactLine(picked.join('；'), 46);

  const f = fieldGroundedFacts(d);
  if (f.bands.length) return compactLine(`关联 ${joinNames(f.bands, 2)}`, 46);
  if (f.roster.length) return compactLine(`旗下 ${joinNames(f.roster, 2)}`, 46);
  if (f.localEntities.length) return compactLine(`承载 ${joinNames(f.localEntities, 2)}`, 46);
  return '';
}

function identityFacts(d) {
  const f = fieldGroundedFacts(d);
  const facts = [];
  const add = value => {
    const fact = compactFact(value);
    if (fact && !facts.includes(fact)) facts.push(fact);
  };
  const addJoined = (label, items, limit = 2) => {
    const joined = joinNames(items, limit);
    if (joined) add(`${label}: ${joined}`);
  };

  if (d.type === 'Band') {
    addJoined('风格', f.styles);
    if (f.city) add(`城市: ${f.city}`);
    addJoined('厂牌', f.labels, 1);
    if (f.chapter) add(f.chapter);
  } else if (d.type === 'Person') {
    addJoined('乐队', f.bands);
    if (f.city) add(`场景: ${f.city}`);
    if (f.chapter) add(f.chapter);
  } else if (d.type === 'Label') {
    addJoined('旗下', f.roster);
    if (f.city) add(`城市: ${f.city}`);
    if (f.chapter) add(f.chapter);
  } else if (d.type === 'City') {
    addJoined('关联', f.localEntities);
    if (f.scene) add(f.scene);
    if (f.chapter) add(f.chapter);
  } else if (d.type === 'Venue' || d.type === 'Event') {
    if (f.city) add(`城市: ${f.city}`);
    addJoined('相关', f.bands);
    if (f.chapter) add(f.chapter);
  } else {
    addJoined('相关', f.bands);
    if (f.city) add(`场景: ${f.city}`);
    if (f.chapter) add(f.chapter);
  }

  if (facts.length < 3) addJoined('风格', f.styles);
  if (facts.length < 3 && f.city) add(`城市: ${f.city}`);
  if (facts.length < 3 && f.chapter) add(f.chapter);
  return facts.slice(0, 3);
}

function fieldGroundedInterpretation(d) {
  const f = fieldGroundedFacts(d);
  const lines = [];
  const place = f.city || f.scene;
  const style = joinNames(f.styles);
  const label = joinNames(f.labels);
  const bands = joinNames(f.bands);
  const localEntities = joinNames(f.localEntities);
  const roster = joinNames(f.roster);
  const collaborators = joinNames(f.collaborators);

  if (d.type === 'Band') {
    if (place && style && label) lines.push(`${place}的${style}乐队，进入${label}的独立发行脉络`);
    else if (place && style) lines.push(`${place}的${style}乐队，体现当地地下音乐的一条方向`);
    else if (style && f.summary) lines.push(`${style}语汇下的代表之一，${f.summary}`);

    if (f.predecessors.length && f.successors.length) lines.push(`承接${joinNames(f.predecessors)}，并延伸到${joinNames(f.successors)}`);
    else if (f.predecessors.length) lines.push(`由${joinNames(f.predecessors)}延伸而来，带出后续风格转向`);
    else if (f.successors.length) lines.push(`其成员和方向延续到${joinNames(f.successors)}`);
    else if (f.summary) lines.push(f.summary);
    else if (collaborators) lines.push(`与${collaborators}的往来，标出它在同期场景中的位置`);
  } else if (d.type === 'Label') {
    if (place && roster) lines.push(`${place}厂牌，以${roster}等乐队塑造独立发行体系`);
    else if (roster) lines.push(`以${roster}等乐队为核心，扩展独立发行实践`);
    else if (f.summary) lines.push(f.summary);

    if (f.scene) lines.push(`${f.scene}中的组织力量，影响乐队录音与流通方式`);
    else if (collaborators) lines.push(`与${collaborators}的合作，体现地下场景的信息流通`);
  } else if (d.type === 'Person') {
    if (bands && label) lines.push(`同时参与${bands}与${label}相关事务，兼具创作和组织角色`);
    else if (bands && place) lines.push(`作为${bands}相关人物，参与${place}场景的形成`);
    else if (bands) lines.push(`通过${bands}留下成员、创作或组织层面的痕迹`);
    else if (label && f.summary) lines.push(`与${label}相关，${f.summary}`);
    else if (label) lines.push(`参与${label}相关事务，体现厂牌组织角色`);

    if (f.summary && !lines.includes(f.summary)) lines.push(f.summary);
    else if (collaborators) lines.push(`与${collaborators}的合作，补足其在场景中的角色`);
  } else if (d.type === 'City') {
    if (f.scene && localEntities) lines.push(`${f.scene}的城市背景，承载${localEntities}等音乐活动`);
    else if (localEntities) lines.push(`${d.label}承载${localEntities}等乐队/场地，是场景地理背景`);
    else lines.push(`${d.label}是相关乐队、厂牌与演出空间的地理背景`);

    if (style) lines.push(`${style}等声音在这里形成可辨识的地方气质`);
  } else if (d.type === 'Venue' || d.type === 'Event') {
    if (place && bands) lines.push(`${place}的现场记忆，留下${bands}等乐队活动痕迹`);
    else if (place && f.summary) lines.push(`${place}场景中的现场片段，${f.summary}`);
    else if (f.summary) lines.push(f.summary);

    if (collaborators) lines.push(`与${collaborators}相关，提示当时演出和社区关系`);
  } else {
    if (place && f.summary) lines.push(`${place}场景中的组织行动，${f.summary}`);
    else if (bands) lines.push(`围绕${bands}等乐队展开，呈现地下场景的社区面`);
    else if (f.summary) lines.push(f.summary);
  }

  if (!lines.length) {
    if (place && label) lines.push(`${place}与${label}之间的音乐关系，使它具有场景意义`);
    else if (style && f.chapter) lines.push(`${style}脉络中的${f.type}，出现在${f.chapter}相关叙述中`);
    else lines.push(`${f.type}，可从相关乐队、厂牌与场景继续理解`);
  }

  return uniqueCompact(lines).slice(0, 2).map(line => compactLine(line));
}

nodeEl.append('text')
  .attr('class', 'micro-label')
  .text(microContextLabel)
  .attr('dy', d => nodeRadius(d) + 22)

const interpretationEl = nodeEl.append('g')

interpretationEl.append('text')
  .attr('class', 'line-1')
  .attr('dy', d => -(nodeRadius(d) + 18))
  .attr('text-anchor', 'middle')
  .text(d => fieldGroundedInterpretation(d)[0]);

interpretationEl.append('text')
  .attr('class', 'line-2')
  .attr('dy', d => -(nodeRadius(d) + 7))
  .attr('text-anchor', 'middle')
  .text(d => fieldGroundedInterpretation(d)[1]);

// Focus controller & neighborhood state
const focusPanel = document.getElementById('focus-panel');
const focusName = document.getElementById('focus-name');
const focusType = document.getElementById('focus-type');
const focusIdentity = document.getElementById('focus-identity');
const focusSummary = document.getElementById('focus-summary');
const focusFacts = document.getElementById('focus-facts');
const focusChips = document.getElementById('focus-chips');

function endpointId(endpoint) {
  return endpoint && endpoint.id ? endpoint.id : endpoint;
}

function linkTouchesNode(l, id) {
  return endpointId(l.source) === id || endpointId(l.target) === id;
}

function focusLinks(d, relType = activeRelationType) {
  return filteredLinks.filter(l => {
    if (!linkTouchesNode(l, d.id)) return false;
    if (relType && l.type !== relType) return false;
    return isLinkVisible(l);
  });
}

function focusNodesFromLinks(d, linksForFocus) {
  const connected = new Set([d.id]);
  linksForFocus.forEach(l => {
    connected.add(endpointId(l.source));
    connected.add(endpointId(l.target));
  });
  return connected;
}

function secondHopState(firstHopIds) {
  const secondHopIds = new Set();
  const pathHintLinks = new Set();
  filteredLinks.forEach(l => {
    if (!isLinkVisible(l)) return;
    const sid = endpointId(l.source);
    const tid = endpointId(l.target);
    const sourceIsFirst = firstHopIds.has(sid);
    const targetIsFirst = firstHopIds.has(tid);
    if (sourceIsFirst === targetIsFirst) return;
    const nextId = sourceIsFirst ? tid : sid;
    if (firstHopIds.has(nextId)) return;
    secondHopIds.add(nextId);
    pathHintLinks.add(l);
  });
  return { secondHopIds, pathHintLinks };
}

function isStepTraceLink(l) {
  if (!activeNode || !previousNode || activeNode.id === previousNode.id) return false;
  if (!isLinkVisible(l)) return false;
  const sid = endpointId(l.source);
  const tid = endpointId(l.target);
  return (sid === activeNode.id && tid === previousNode.id) || (sid === previousNode.id && tid === activeNode.id);
}

function renderFocusController(d) {
  if (!d) {
    focusPanel.classList.remove('show');
    focusIdentity.classList.add('empty');
    focusSummary.textContent = '';
    focusFacts.replaceChildren();
    focusChips.replaceChildren();
    return;
  }
  focusName.textContent = d.label;
  focusType.textContent = formatLabel('type', d.type);
  focusType.style.color = COLORS[d.type] || '#888';
  const summary = identitySummary(d);
  const facts = identityFacts(d);
  focusSummary.textContent = summary;
  focusFacts.replaceChildren();
  facts.forEach(fact => {
    const el = document.createElement('span');
    el.className = 'fp-fact';
    el.textContent = fact;
    focusFacts.appendChild(el);
  });
  focusIdentity.classList.toggle('empty', !summary && !facts.length);
  focusChips.replaceChildren();

  relationTypes.forEach(rel => {
    const hasRelation = focusLinks(d, rel).length > 0;
    const chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'rel-chip';
    chip.textContent = formatLabel('relation', rel);
    chip.disabled = !hasRelation;
    chip.classList.toggle('active', activeRelationType === rel);
    chip.style.color = activeRelationType === rel ? (LINK_COLORS[rel] || '#e8e4dc') : '';
    chip.addEventListener('click', e => {
      e.stopPropagation();
      activeRelationType = activeRelationType === rel ? null : rel;
      applyFocusState(true);
    });
    focusChips.appendChild(chip);
  });
  focusPanel.classList.add('show');
}

function applyFocusState(reframe = false) {
  if (!activeNode) {
    clearFocusVisuals();
    return;
  }
  if (activeRelationType && focusLinks(activeNode, activeRelationType).length === 0) {
    activeRelationType = null;
  }

  const linksForFocus = focusLinks(activeNode);
  const connected = focusNodesFromLinks(activeNode, linksForFocus);
  const focusLinkSet = new Set(linksForFocus);
  const { secondHopIds, pathHintLinks } = secondHopState(connected);

  nodeEl.classed('dimmed', n => !connected.has(n.id) && !secondHopIds.has(n.id) && (!previousNode || n.id !== previousNode.id));
  nodeEl.classed('highlighted', n => connected.has(n.id));
  nodeEl.classed('second-hop', n => secondHopIds.has(n.id));
  nodeEl.classed('previous-node', n => previousNode && n.id === previousNode.id && n.id !== activeNode.id);
  nodeEl.classed('focus-center', n => n.id === activeNode.id);
  nodeEl.classed('neighbor', n => n.id !== activeNode.id && connected.has(n.id));
  linkEl.classed('dimmed', l => !focusLinkSet.has(l) && !pathHintLinks.has(l) && !isStepTraceLink(l));
  linkEl.classed('highlighted', l => focusLinkSet.has(l));
  linkEl.classed('path-hint', l => pathHintLinks.has(l));
  linkEl.classed('step-trace', isStepTraceLink);

  // 焦点模式下只保留焦点邻域与锚点标签，迫使理解回到 graph。
  highlightOn = true;
  nodeEl.selectAll('text.node-name').style('display', n =>
    (connected.has(n.id) || ANCHOR_LABEL.has(n.type)) ? null : 'none');
  nodeEl.selectAll('text.micro-label').style('display', n =>
    (connected.has(n.id) || secondHopIds.has(n.id)) ? null : 'none');
  nodeEl.selectAll('g.micro-interpretation').style('display', n =>
    n.id === activeNode.id ? null : 'none');

  renderFocusController(activeNode);
  updateViewSummary();
  if (reframe) focusNeighborhoodView(activeNode, connected, 520);
}

function clearFocusVisuals() {
  nodeEl
    .classed('dimmed', false)
    .classed('highlighted', false)
    .classed('second-hop', false)
    .classed('previous-node', false)
    .classed('focus-center', false)
    .classed('neighbor', false);
  linkEl.classed('dimmed', false).classed('highlighted', false).classed('path-hint', false).classed('step-trace', false);
  // 还原为按当前缩放比例决定的标签可见性
  highlightOn = false;
  applyLabelVisibility();
  nodeEl.selectAll('g.micro-interpretation').style('display', 'none');
  renderFocusController(null);
}

function selectNode(d) {
  previousNode = activeNode && activeNode.id !== d.id ? activeNode : null;
  activeNode = d;
  activeRelationType = null;
  applyFocusState(true);
}

function clearSelection() {
  activeNode = null;
  previousNode = null;
  activeRelationType = null;
  clearFocusVisuals();
  updateViewSummary();
}

nodeEl
  // 点击节点只移动焦点；panel 只是关系控制层，不承载详情阅读。
  .on('click', function(e, d) {
    e.stopPropagation();
    selectNode(d);
  });

// 点击空白处清除高亮（移动端无 mouseout 时尤其重要）
svg.on('click', clearSelection);
window.addEventListener('keydown', e => {
  if (e.key === 'Escape') clearSelection();
});

// tick
sim.on('tick', () => {
  linkEl
    .attr('x1', d => d.source.x).attr('y1', d => d.source.y)
    .attr('x2', d => d.target.x).attr('y2', d => d.target.y);
  nodeEl.attr('transform', d => `translate(${d.x},${d.y})`);
});

// 当前视图摘要
updateViewSummary();

// 自适应缩放：根据所有节点的包围盒，把整张网络缩放/平移到视口内（留出边距）
// 取代固定缩放——节点变多后能保证移动端首屏就能看到全貌
function fitView(duration = 0) {
  if (!filteredNodes.length) return;
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  filteredNodes.forEach(n => {
    if (n.x == null || n.y == null) return;
    minX = Math.min(minX, n.x); maxX = Math.max(maxX, n.x);
    minY = Math.min(minY, n.y); maxY = Math.max(maxY, n.y);
  });
  if (!isFinite(minX)) return;
  const w = window.innerWidth, h = window.innerHeight;
  const pad = isMobile() ? 48 : 90;
  const gw = (maxX - minX) || 1, gh = (maxY - minY) || 1;
  const scale = Math.min((w - pad * 2) / gw, (h - pad * 2) / gh, isMobile() ? 1.1 : 1.4);
  const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
  const t = d3.zoomIdentity.translate(w / 2, h / 2).scale(scale).translate(-cx, -cy);
  (duration ? svg.transition().duration(duration) : svg).call(zoom.transform, t);
}

function focusNeighborhoodView(centerNode, connectedIds, duration = 0) {
  const nodesForFrame = filteredNodes.filter(n => connectedIds.has(n.id) && isNodeVisible(n));
  if (!nodesForFrame.length || centerNode.x == null || centerNode.y == null) return;
  let maxDx = 0, maxDy = 0;
  nodesForFrame.forEach(n => {
    if (n.x == null || n.y == null) return;
    maxDx = Math.max(maxDx, Math.abs(n.x - centerNode.x));
    maxDy = Math.max(maxDy, Math.abs(n.y - centerNode.y));
  });

  const w = window.innerWidth, h = window.innerHeight;
  const leftPad = isMobile() ? 36 : 90;
  const rightPad = isMobile() ? 36 : 300;
  const topPad = isMobile() ? 138 : 88;
  const bottomPad = isMobile() ? 92 : 94;
  const availableW = Math.max(220, w - leftPad - rightPad);
  const availableH = Math.max(220, h - topPad - bottomPad);
  const gw = Math.max(maxDx * 2, 120);
  const gh = Math.max(maxDy * 2, 120);
  const scale = Math.min(availableW / gw, availableH / gh, isMobile() ? 1.55 : 1.9);
  const targetX = leftPad + availableW / 2;
  const targetY = topPad + availableH / 2;
  const t = d3.zoomIdentity.translate(targetX, targetY).scale(scale).translate(-centerNode.x, -centerNode.y);
  (duration ? svg.transition().duration(duration) : svg).call(zoom.transform, t);
}

// 焦点节点：连接最密集的枢纽（多为某座城市或核心厂牌），作为移动端的引导入口
function computeFocusNode() {
  const deg = {};
  filteredLinks.forEach(l => {
    const s = l.source.id || l.source, t = l.target.id || l.target;
    deg[s] = (deg[s] || 0) + 1; deg[t] = (deg[t] || 0) + 1;
  });
  let best = null, bestDeg = -1;
  filteredNodes.forEach(n => { const d = deg[n.id] || 0; if (d > bestDeg) { bestDeg = d; best = n; } });
  return best;
}
const focusNode = computeFocusNode();

// 入口视图：
// - 桌面端：自适应铺满全图（空间足够、可悬停）
// - 移动端：以接近真实大小的比例聚焦到枢纽节点附近，只露出局部，引导用户拖拽探索
function entryView(duration = 0) {
  if (!isMobile()) return fitView(duration);
  const f = focusNode;
  if (!f || f.x == null) return fitView(duration);
  const w = window.innerWidth, h = window.innerHeight;
  const scale = 1.05;
  const t = d3.zoomIdentity.translate(w / 2, h / 2).scale(scale).translate(-f.x, -f.y);
  (duration ? svg.transition().duration(duration) : svg).call(zoom.transform, t);
}

// 预热力导向：在首屏绘制前同步收敛到最终布局，然后只定位一次相机。
// 这样可避免移动端「收敛漂移」以及收敛后相机二次回中造成的整体轻微位移抖动。
sim.alpha(1).stop();
for (let i = 0; i < 320; i++) sim.tick();
// 把最终位置一次性刷到 DOM
linkEl
  .attr('x1', d => d.source.x).attr('y1', d => d.source.y)
  .attr('x2', d => d.target.x).attr('y2', d => d.target.y);
nodeEl.attr('transform', d => `translate(${d.x},${d.y})`);
applyLabelVisibility(1.05);
// 入口视图只在这里定位一次（此后相机不再自动移动）
entryView(0);

// 控制按钮
document.getElementById('btn-zoom-in').addEventListener('click', () =>
  svg.transition().call(zoom.scaleBy, 1.4));
document.getElementById('btn-zoom-out').addEventListener('click', () =>
  svg.transition().call(zoom.scaleBy, 0.7));
// 重置 = 清除焦点并回到入口视图（桌面铺满全图 / 移动端回到枢纽）
document.getElementById('btn-reset').addEventListener('click', () => {
  clearSelection();
  entryView(600);
});


// ── Scene 叠加 ──
const sceneListEl = document.getElementById('scene-list');
scenes.forEach(sc => {
  const btn = document.createElement('button');
  btn.className = 'scene-btn';
  btn.textContent = sc.label;
  btn.dataset.scId = sc.id;
  btn.onclick = () => activateScene(sc, btn);
  sceneListEl.appendChild(btn);
});

// 折叠/展开场景面板（移动端默认收起，只留一个标题条）
const scenePanel = document.getElementById('scene-panel');
const sceneTitle = document.getElementById('scene-title');
sceneTitle.addEventListener('click', () => scenePanel.classList.toggle('collapsed'));
// 点击面板以外的任意区域收起展开的场景面板
document.addEventListener('click', e => {
  if (!scenePanel.contains(e.target)) scenePanel.classList.add('collapsed');
});
if (isMobile()) scenePanel.classList.add('collapsed');

function activateScene(sc, btn) {
  if (activeScene && activeScene.id === sc.id) { clearScene(); return; }
  activeScene = sc;
  if (activeNode && !(sc.nodes || []).includes(activeNode.id)) {
    activeNode = null;
    previousNode = null;
    activeRelationType = null;
  }
  if (previousNode && !(sc.nodes || []).includes(previousNode.id)) previousNode = null;
  document.querySelectorAll('.scene-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const inScene = new Set(sc.nodes);
  nodeEl.classed('scene-lit', d => inScene.has(d.id));
  nodeEl.classed('scene-dim', d => !inScene.has(d.id));
  linkEl.style('opacity', l =>
    inScene.has(l.source.id) && inScene.has(l.target.id) ? 0.8 : 0.04);
  if (activeNode) applyFocusState(true);
  else clearFocusVisuals();
  updateViewSummary();
  // 移动端选定后自动收起面板，露出图形
  if (isMobile()) scenePanel.classList.add('collapsed');
}

function clearScene() {
  activeScene = null;
  document.querySelectorAll('.scene-btn').forEach(b => b.classList.remove('active'));
  nodeEl.classed('scene-lit', false).classed('scene-dim', false);
  linkEl.style('opacity', null);
  if (activeNode) applyFocusState(true);
  else clearFocusVisuals();
  updateViewSummary();
}

// 旋屏 / 窗口尺寸变化：更新力的中心、按当前断点重算半径与热区，并重新适配视图
let resizeTimer = null, lastW = window.innerWidth;
window.addEventListener('resize', () => {
  const w = window.innerWidth, h = window.innerHeight;
  // 移动端忽略「仅高度变化」（多为地址栏显隐）——否则会无谓重排并让相机抖动
  if (isMobile() && w === lastW) return;
  lastW = w;
  sim.force('center', d3.forceCenter(w/2, h/2));
  sim.force('x', d3.forceX(w/2).strength(0.05));
  sim.force('y', d3.forceY(h/2).strength(0.05));
  // 跨断点时重算与移动端相关的视觉量
  nodeEl.select('circle.dot').attr('r', nodeRadius);
  nodeEl.select('circle.hit').attr('r', d => nodeRadius(d) + (isMobile() ? 16 : 8));
  nodeEl.select('text.node-name').attr('dy', d => nodeRadius(d) + 11);
  nodeEl.select('text.micro-label').attr('dy', d => nodeRadius(d) + 22);
  nodeEl.select('g.micro-interpretation text.line-1').attr('dy', d => -(nodeRadius(d) + 18));
  nodeEl.select('g.micro-interpretation text.line-2').attr('dy', d => -(nodeRadius(d) + 7));
  if (!highlightOn) applyLabelVisibility();
  updateViewSummary();
  sim.alpha(0.2).restart();
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => entryView(400), 350);
});
</script>
</body>
</html>
