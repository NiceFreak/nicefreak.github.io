gin-bottom:9px}.focus-card h1{margin:0 0 7px;font-size:24px;line-height:1.22;letter-spacing:.2px}.focus-card .desc{margin:0;color:var(--text);opacity:.82;font-size:14px}.focus-card .evmeta{margin-top:10px;font-size:13px;color:var(--muted)}.focus-card .frame{margin:12px 0 0;padding-top:11px;border-top:1px dashed var(--line);font-size:13px;color:var(--muted)}.focus-card .frame b{color:var(--accent);font-weight:600}.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.chip{font-size:13px;padding:6px 13px;border-radius:999px;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--muted);min-height:34px;transition:transform .08s ease,background .15s ease,color .15s ease}.chip:active{transform:scale(.94)}.chip.active{background:var(--accent);color:#14110f;border-color:var(--accent);font-weight:600}.chip .n{opacity:.6;margin-left:5px;font-size:12px}.chip.active .n{opacity:.8}.neighbors{list-style:none;margin:0;padding:0}.neighbors li{display:flex;align-items:center;gap:12px;padding:13px 14px;min-height:56px;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;cursor:pointer;transition:transform .08s ease,background .15s ease,border-color .15s ease;animation:enter .24s ease both}.neighbors li:active{transform:scale(.985);background:var(--card-hi);border-color:var(--accent)}.neighbors .dot{width:11px;height:11px;border-radius:50%;flex:0 0 auto;box-shadow:0 0 0 3px color-mix(in srgb,var(--dot) 22%,transparent)}.neighbors .nb-main{flex:1;min-width:0}.neighbors .nb-name{font-size:16px}.neighbors .nb-rel{font-size:12px;color:var(--muted);margin-top:2px}.neighbors .nb-type{font-size:11px;color:var(--muted);flex:0 0 auto}.neighbors .chev{color:var(--muted);flex:0 0 auto;font-size:15px}.scent{color:var(--muted);font-size:13px;text-align:center;padding:6px 0 4px}.scent a{color:var(--accent);cursor:pointer}.legend{margin-top:14px;font-size:12px;color:var(--muted)}.legend > summary{cursor:pointer;list-style:none;padding:4px 0}.legend > summary::-webkit-details-marker{display:none}.legend > summary::before{content:"🎨 "}.legend-items{display:flex;gap:12px;flex-wrap:wrap;padding:6px 0 2px}.legend-items span{display:inline-flex;align-items:center;gap:5px}.legend-items i{width:9px;height:9px;border-radius:50%;display:inline-block}.dock{position:sticky;bottom:0;padding:10px 14px 16px;background:linear-gradient(transparent,var(--bg) 35%)}.entry-btn{width:100%;padding:14px;border-radius:12px;min-height:50px;background:var(--card-hi);color:var(--text);border:1px solid var(--line);font-size:15px;cursor:pointer;transition:transform .08s ease,background .15s ease}.entry-btn:active{transform:scale(.99);background:var(--card)}.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.55);animation:fade .2s ease}.sheet[hidden]{display:none}.sheet-inner{width:100%;max-width:480px;background:var(--card);border-radius:20px 20px 0 0;border:1px solid var(--line);padding:18px 16px 26px;max-height:86vh;overflow-y:auto;animation:slideUp .26s cubic-bezier(.2,.7,.3,1)}.sheet-head{display:flex;justify-content:space-between;align-items:center}.sheet-head strong{font-size:18px}.sheet-head .x{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;padding:4px}.sheet-lede{color:var(--text);opacity:.85;font-size:14px;margin:8px 0 14px}.how{list-style:none;counter-reset:s;margin:0 0 16px;padding:0;display:flex;flex-direction:column;gap:9px}.how li{counter-increment:s;display:flex;align-items:baseline;gap:9px;font-size:13px;color:var(--muted)}.how li::before{content:counter(s);flex:0 0 auto;width:20px;height:20px;border-radius:50%;background:var(--card-hi);border:1px solid var(--line);color:var(--accent);font-size:12px;text-align:center;line-height:20px}.how b{color:var(--text);font-weight:600}.sheet-hint{color:var(--muted);font-size:13px;margin:0 0 10px}.entry-list{list-style:none;margin:0;padding:0}.entry-list li{padding:13px 1 <body>
<div id="app">
  <!-- 顶栏：返回键 + 面包屑（可读关系轨迹，spec §4） -->
  <header class="topbar">
    <button id="back-btn" class="back" type="button" aria-label="返回上一步" disabled>‹</button>
    <div id="trail" class="trail" aria-label="已走过的关系轨迹"></div>
  </header>

  <main id="stage" class="stage">
    <!-- 焦点卡：当前所在节点 = 这一屏的“重点” -->
    <section id="focus" class="focus-card"></section>

    <!-- 关系类型筹码（Beef Mode 同款，spec §3/§4） -->
    <nav id="chips" class="chips" aria-label="按关系类型筛选"></nav>

    <!-- 直接邻居列表（只渲染邻域，spec §2/§3） -->
    <ul id="neighbors" class="neighbors" aria-label="直接邻居"></ul>

    <p id="scent" class="scent" hidden></p>

    <!-- 颜色规则：收成可折叠，默认不占视野（降低首屏信息量） -->
    <details class="legend">
      <summary>圆点颜色 = 实体类型</summary>
      <div class="legend-items">
        <span><i style="background:var(--t-Person)"></i>人物</span>
        <span><i style="background:var(--t-Band)"></i>乐队</span>
        <span><i style="background:var(--t-Label)"></i>厂牌</span>
        <span><i style="background:var(--t-City)"></i>城市</span>
        <span><i style="background:var(--t-Venue)"></i>场地</span>
        <span><i style="background:var(--t-Event)"></i>同台</span>
      </div>
    </details>
  </main>

  <!-- 断路逃生 / 换起点 / 玩法（spec §3.1、§5、§6） -->
  <footer class="dock">
    <button id="entry-btn" class="entry-btn" type="button">🧭 换个起点 · 玩法</button>
  </footer>

  <!-- 起点 + 引导浮层（首次进入自动打开） -->
  <div id="entry-sheet" class="sheet" hidden>
    <div class="sheet-inner">
      <div class="sheet-head">
        <strong>之间 · 顺着关系走</strong>
        <button id="entry-close" class="x" type="button" aria-label="关闭">✕</button>
      </div>
      <p class="sheet-lede">这不是搜索，是漫游。从一个名字出发，一跳一跳地走，看你会被带到哪里。</p>
      <ol class="how">
        <li><b>点一行</b><span>跳到它身边</span></li>
        <li><b>顶部筹码</b><span>只看某一种关系</span></li>
        <li><b>面包屑 / 返回</b><span>回头或换个起点</span></li>
      </ol>
      <p class="sheet-hint">挑个起点出发：</p>
      <ul id="entry-list" class="entry-list"></ul>
    </div>
  </div>
</div>
