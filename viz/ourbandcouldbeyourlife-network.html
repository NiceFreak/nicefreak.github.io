<!DOCTYPE html>
<html lang="zh">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>可视化关系网络 - 我们的乐队也可以成为你的生活</title>
  <script src="js/d3.min.js"></script>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/graph.css">
  <link rel="stylesheet" href="css/panel.css">
</head>

<body>

  <div id="header">
    <h1>Our Band Could Be Your Life — 关系网络</h1>
  </div>

  <div id="legend"></div>
  <div id="scene-panel">
    <div id="scene-title">场景叠加</div>
    <div id="scene-list"></div>
    <div id="scene-clear">清除 ×</div>
  </div>

  <div id="focus-panel">
    <div id="focus-trail" class="fp-trail"></div>
    <div id="focus-edge" class="fp-edge"></div>
    <div class="fp-identity empty" id="focus-identity">
      <div class="fp-name" id="focus-name"></div>
      <div class="fp-type" id="focus-type"></div>
      <div class="fp-summary" id="focus-summary"></div>
      <div class="fp-facts" id="focus-facts"></div>
    </div>
    <div id="focus-chips"></div>
  </div>

  <div id="controls">
    <button class="ctrl-btn" id="btn-zoom-in">+</button>
    <button class="ctrl-btn" id="btn-zoom-out">−</button>
    <button class="ctrl-btn" id="btn-reset" title="重置视角">⌂</button>
  </div>

  <div id="info">
    <span id="view-summary">—</span>
  </div>

  <svg id="svg">
    <defs>
      <filter id="glow" x="-120%" y="-120%" width="340%" height="340%" filterUnits="objectBoundingBox">
        <feGaussianBlur stdDeviation="3" result="coloredBlur" />
        <feMerge>
          <feMergeNode in="coloredBlur" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>
    </defs>
    <g id="root"></g>
  </svg>

  <script src="js/state.js"></script>
  <script src="js/panel.js"></script>
  <script src="js/graph.js"></script>
  <script src="js/scene.js"></script>
</body>

</html>
