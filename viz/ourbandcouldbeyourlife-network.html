<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>可视化关系网络 - 我们的乐队也可以成为你的生活</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0e0e0e;
    color: #e8e4dc;
    font-family: 'Courier New', monospace;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
  }

  #header {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 10;
    padding: 16px 24px;
    display: flex;
    align-items: baseline;
    gap: 16px;
    background: linear-gradient(to bottom, #0e0e0e 60%, transparent);
    pointer-events: none;
  }
  #header h1, #header span { pointer-events: none; }

  #header h1 {
    font-size: 13px;
    font-weight: normal;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #e8e4dc;
  }

  #header span {
    font-size: 11px;
    color: #555;
    letter-spacing: 0.05em;
  }

  #legend {
    position: fixed;
    top: 56px; left: 24px;
    z-index: 10;
    display: flex;
    flex-direction: column;
    gap: 6px;
    pointer-events: auto;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 10px;
    letter-spacing: 0.1em;
    color: #777;
    text-transform: uppercase;
    cursor: pointer;
    transition: color 0.2s;
  }

  .legend-item:hover { color: #e8e4dc; }
  .legend-item.off { opacity: 0.4; }
  .legend-item.off .legend-dot { background: #444 !important; }
  .legend-item.off span, .legend-item.off { text-decoration: line-through; }

  .legend-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  #tooltip {
    position: fixed;
    z-index: 20;
    background: #1a1a1a;
    border: 1px solid #333;
    padding: 12px 16px;
    font-size: 11px;
    line-height: 1.6;
    max-width: 260px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.15s;
  }

  #tooltip .tt-name {
    font-size: 13px;
    color: #e8e4dc;
    margin-bottom: 4px;
    letter-spacing: 0.05em;
  }

  #tooltip .tt-type {
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    margin-bottom: 8px;
  }

  #tooltip .tt-detail {
    color: #888;
    font-size: 10px;
  }

  #controls {
    position: fixed;
    bottom: 24px; right: 24px;
    z-index: 10;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .ctrl-btn {
    width: 32px; height: 32px;
    background: #1a1a1a;
    border: 1px solid #333;
    color: #888;
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
    font-family: monospace;
  }

  .ctrl-btn:hover {
    background: #252525;
    color: #e8e4dc;
    border-color: #555;
  }

  #info {
    position: fixed;
    bottom: 24px; left: 24px;
    z-index: 10;
    font-size: 10px;
    color: #444;
    letter-spacing: 0.08em;
    line-height: 1.8;
  }

  svg { width: 100%; height: 100%; }

  .node { cursor: pointer; }
  .node circle { transition: r 0.2s; }
  .node:hover circle { }
  .node text { pointer-events: none; }

  .link {
    stroke-opacity: 0.35;
    transition: stroke-opacity 0.2s;
  }

  .link.highlighted { stroke-opacity: 0.9; }
  .link.dimmed { stroke-opacity: 0.05; }
  .node.dimmed { opacity: 0.15; }
  .node.highlighted { opacity: 1; }

  /* 场景叠加面板 */
  #scene-panel {
    position: fixed;
    top: 56px; right: 24px;
    z-index: 10;
    width: 180px;
    max-height: calc(100vh - 110px);
    overflow-y: auto;
    background: rgba(20,20,20,0.85);
    border: 1px solid #2a2a2a;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    -webkit-overflow-scrolling: touch;
  }

  #scene-title {
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #777;
    margin-bottom: 2px;
    cursor: pointer;
    user-select: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  #scene-title::after { content: '▾'; font-size: 9px; color: #777; }
  #scene-panel.collapsed #scene-title { margin-bottom: 0; }
  #scene-panel.collapsed #scene-title::after { content: '▸'; }
  #scene-panel.collapsed #scene-list,
  #scene-panel.collapsed #scene-clear { display: none; }

  #scene-list {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .scene-btn {
    width: 100%;
    text-align: left;
    background: #1a1a1a;
    border: 1px solid #333;
    color: #999;
    font-family: inherit;
    font-size: 10px;
    letter-spacing: 0.03em;
    line-height: 1.4;
    padding: 6px 8px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .scene-btn:hover { background: #252525; color: #e8e4dc; border-color: #555; }
  .scene-btn.active {
    background: #2a2419;
    color: #c9a94e;
    border-color: #c9a94e;
  }

  #scene-clear {
    font-size: 10px;
    letter-spacing: 0.05em;
    color: #666;
    cursor: pointer;
    padding-top: 4px;
    user-select: none;
  }
  #scene-clear:hover { color: #e05c3a; }

  /* 场景高亮状态 */
  .node.scene-dim { opacity: 0.12; }
  .node.scene-lit circle { filter: url(#glow); }

  /* 触屏与缩放 */
  svg { touch-action: none; }

  /* ── 移动端适配 ── */
  @media (max-width: 768px) {
    #header { padding: 10px 14px; flex-direction: column; gap: 2px; align-items: flex-start; }
    #header h1 { font-size: 11px; letter-spacing: 0.08em; line-height: 1.3; }
    /* 移动端隐藏冗长的操作提示，保持顶栏紧凑、不与场景面板重叠 */
    #header span { display: none; }

    #legend {
      top: auto; bottom: 70px; left: 12px;
      flex-direction: row; flex-wrap: wrap;
      gap: 6px 12px;
      max-width: calc(100vw - 24px);
      background: rgba(14,14,14,0.7);
      padding: 6px 8px;
    }
    .legend-item { font-size: 9px; }

    /* 移动端：场景面板改为左上角可折叠下拉，默认收起 */
    #scene-panel {
      top: 60px; bottom: auto; left: 12px; right: auto;
      width: auto; min-width: 148px; max-width: calc(100vw - 90px);
      max-height: none;
      background: rgba(18,18,18,0.95);
    }
    #scene-list {
      flex-direction: column; flex-wrap: nowrap;
      max-height: 52vh; overflow-y: auto; overflow-x: visible;
      margin-top: 6px;
    }
    .scene-btn { flex: none; min-width: 0; width: 100%; font-size: 11px; padding: 9px 10px; }
    #scene-title { font-size: 11px; }
    #scene-clear { align-self: flex-start; font-size: 11px; padding: 8px 2px 2px; }

    #controls { bottom: auto; top: 12px; right: 12px; gap: 8px; }
    .ctrl-btn { width: 40px; height: 40px; font-size: 20px; }

    #info { bottom: 12px; left: 12px; font-size: 9px; z-index: 5; }

    #tooltip { max-width: calc(100vw - 32px); font-size: 12px; }

    .node text { font-size: 11px; }
  }

  /* 隐藏滚动条但保留滚动 */
  #scene-panel::-webkit-scrollbar { width: 6px; height: 6px; }
  #scene-panel::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
</style>
</head>
<body>

<div id="header">
  <h1>Our Band Could Be Your Life — 关系网络</h1>
  <span>数据来源：Michael Azerrad《Our Band Could Be Your Life》 &nbsp;·&nbsp; 拖拽移动 &nbsp;·&nbsp; 滚轮缩放 &nbsp;·&nbsp; 点击节点查看详情 &nbsp;·&nbsp; 点击图例切换类型</span>

<div id="legend"></div>
<div id="scene-panel"><div id="scene-title">场景叠加</div><div id="scene-list"></div><div id="scene-clear" onclick="clearScene()">清除 ×</div></div>

<div id="tooltip">

  <div class="tt-type" id="tt-type"></div>
  <div class="tt-detail" id="tt-detail"></div>
</div>

<div id="controls">
  <button class="ctrl-btn" id="btn-zoom-in">+</button>
  <button class="ctrl-btn" id="btn-zoom-out">−</button>
  <button class="ctrl-btn" id="btn-reset" title="重置视角">⌂</button>
</div>

<div id="info">
  节点数：<span id="node-count">—</span> &nbsp;·&nbsp; 关系数：<span id="link-count">—</span>
</div>

<svg id="svg">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g id="root"></g>
</svg>

  { source:'husker_du',     target:'new_alliance',  type:'affiliation', label:'早期发行（Land Speed Record）' },

  // 场地 → 城市
  { source:'v_930',        target:'city_dc',      type:'location_of', label:'位于' },
  { source:'v_wilson',     target:'city_dc',      type:'location_of', label:'位于' },
  { source:'v_tropicana',  target:'city_olympia', type:'location_of', label:'位于' },
  { source:'v_union',      target:'city_sp',      type:'location_of', label:'位于' },
  { source:'v_cbgb',       target:'city_ny',      type:'location_of', label:'位于' },
  { source:'v_steamplant', target:'city_seattle', type:'location_of', label:'位于' },
  { source:'v_folkcity',   target:'city_ny',      type:'location_of', label:'位于' },
  { source:'v_obanions',   target:'city_chicago', type:'location_of', label:'位于' },
  // 场地 ↔ 关键演出（无独立事件记录的）
  { source:'minutemen',    target:'v_union',      type:'appearance',  label:'D. Boon 运营/演出' },
  { source:'minor_threat', target:'v_obanions',   type:'appearance',  label:'演出（Durango 做音响）' },

  // 事件 → 参与实体 / 场地
  { source:'e001', target:'black_flag',    type:'appearance', label:'演出' },
  { source:'e001', target:'beat_happening',type:'appearance', label:'暖场' },
  { source:'e001', target:'v_tropicana',   type:'appearance', label:'地点' },
  { source:'e002', target:'sonic_youth',   type:'appearance', label:'观看' },
  { source:'e002', target:'dinosaur_jr',   type:'appearance', label:'演出' },
  { source:'e002', target:'v_folkcity',    type:'appearance', label:'地点' },
  { source:'e003', target:'sonic_youth',   type:'appearance', label:'同台' },
  { source:'e003', target:'dinosaur_jr',   type:'appearance', label:'同台' },
  { source:'e003', target:'lee_ranaldo',   type:'appearance', label:'上台合唱' },
  { source:'e004', target:'minor_threat',  type:'appearance', label:'同行' },
  { source:'e004', target:'youth_brigade', type:'appearance', label:'同行' },
  { source:'e005', target:'big_black',     type:'appearance', label:'最后演出' },
  { source:'e005', target:'mark_arm',      type:'appearance', label:'台下第一排' },
  { source:'e005', target:'v_steamplant',  type:'appearance', label:'地点' },
  { source:'e006', target:'replacements',  type:'appearance', label:'演出' },
  { source:'e006', target:'v_cbgb',        type:'appearance', label:'地点' },
  { source:'e007', target:'fugazi',        type:'appearance', label:'演出' },
  { source:'e008', target:'mission_burma', type:'appearance', label:'告别演出' },
  { source:'e009', target:'beat_happening',type:'appearance', label:'演出' },
  { source:'e009', target:'sonic_youth',   type:'appearance', label:'演出' },
  { source:'e010', target:'fugazi',        type:'appearance', label:'演出' }];



// ── Scene 数据 ──
const scenes = [
  { id:'sc001', label:'D.C. 硬核场景 1979–83',      type:'本地',
    nodes:['minor_threat','teen_idles','soa','bad_brains','youth_brigade','govt_issue','dischord','mackaye','nelson','preslar','baker','strejcek','rollins','city_dc','v_930','v_wilson','e004'] },
  { id:'sc002', label:'D.C. 后硬核场景 1984–',       type:'本地',
    nodes:['fugazi','rites_of_spring','embrace','dischord','mackaye','picciotto','joe_lally','brendan_canty','positive_force','mark_andersen','city_dc','e007','e010'] },
  { id:'sc003', label:'SST 生态圈 1978–89',          type:'跨地域',
    nodes:['sst','black_flag','minutemen','firehose','husker_du','sonic_youth','greg_ginn','dukowski','rollins','watt','boon','hurley','bob_mould','grant_hart','city_la','city_sp','city_minneapolis','city_ny','v_union'] },
  { id:'sc004', label:'奥林匹亚 K 场景 1982–',       type:'本地+跨地域',
    nodes:['beat_happening','k_records','calvin_johnson','heather_lewis','bret_lunsford','city_olympia','v_tropicana','e001'] },
  { id:'sc005', label:'西雅图格朗基场景 1986–92',    type:'本地',
    nodes:['mudhoney','green_river','tad','sub_pop','pavitt','poneman','jack_endino','mark_arm','steve_turner','matt_lukin','dan_peters','city_seattle','v_steamplant','e005','e009'] },
  { id:'sc006', label:'明尼阿波利斯另类摇滚',        type:'本地',
    nodes:['husker_du','replacements','twin_tone','bob_mould','grant_hart','greg_norton','westerberg','bob_stinson','jesperson','city_minneapolis'] },
  { id:'sc007', label:'芝加哥工业/噪音场景 1981–87', type:'本地',
    nodes:['big_black','necros','touch_go','albini','durango','dave_riley','corey_rusk','city_chicago','v_obanions'] },
  { id:'sc008', label:'纽约艺术/噪音场景 1981–90',   type:'本地',
    nodes:['sonic_youth','city_ny','thurston_moore','kim_gordon','lee_ranaldo','steve_shelley','glenn_branca','the_coachmen','v_cbgb','v_folkcity','e002'] },
  { id:'sc009', label:'波士顿后朋克场景 1979–83',    type:'本地',
    nodes:['mission_burma','ace_of_hearts','city_boston','e008'] },
  { id:'sc010', label:'K 国际流行地下网络 1982–',    type:'跨地域',
    nodes:['k_records','beat_happening','calvin_johnson','sub_pop','thurston_moore','city_olympia','e009'] },
  { id:'sc011', label:'阿默斯特/Dinosaur Jr 谱系',   type:'本地',
    nodes:['dinosaur_jr','mogo','deep_wound','mascis','barlow','murph','homestead','city_amherst','v_maxwells'] },
];

let activeScene = null;

// ── 渲染 ──
const svg = d3.select('#svg');
const root = d3.select('#root');
const width = window.innerWidth;
const height = window.innerHeight;

const zoom = d3.zoom()
  .scaleExtent([0.2, 4])
  .on('zoom', e => root.attr('transform', e.transform));

svg.call(zoom);

// 图例（点击可切换显示/隐藏某一类实体）
const typeLabels = { Band:'乐队', Person:'人物', Label:'厂牌', City:'城市', Project:'组织/项目', Venue:'场地', Event:'事件' };
const hiddenTypes = new Set();
const legendEl = document.getElementById('legend');
Object.entries(typeLabels).forEach(([type, label]) => {
  const item = document.createElement('div');
  item.className = 'legend-item';
  item.dataset.type = type;
  item.innerHTML = `<div class="legend-dot" style="background:${COLORS[type]}"></div>${label}`;
  item.addEventListener('click', () => {
    if (hiddenTypes.has(type)) hiddenTypes.delete(type); else hiddenTypes.add(type);
    item.classList.toggle('off', hiddenTypes.has(type));
    applyTypeFilter();
  });
  legendEl.appendChild(item);
});

// 按类型显示/隐藏（隐藏节点时，连到它的关系也一并隐藏）
function applyTypeFilter() {
  nodeEl.style('display', d => hiddenTypes.has(d.type) ? 'none' : null);
  linkEl.style('display', d =>
    (hiddenTypes.has((d.source.type)) || hiddenTypes.has((d.target.type))) ? 'none' : null);
}

// 力导向
const filteredIds = new Set(filteredNodes.map(n => n.id));
// 清洗关系：丢弃数组空洞、指向不存在节点的关系，并按 来源>目标:类型 去重
const seenLinkKeys = new Set();
const filteredLinks = links.filter(l => {
  if (!l || !filteredIds.has(l.source) || !filteredIds.has(l.target)) return false;
  const key = l.source + '>' + l.target + ':' + l.type;
  if (seenLinkKeys.has(key)) return false;
  seenLinkKeys.add(key);
  return true;
});

const sim = d3.forceSimulation(filteredNodes)
  .force('link', d3.forceLink(filteredLinks).id(d => d.id).distance(d => {
    if (d.type === 'location_of') return 140;
    if (d.type === 'membership') return 80;
    if (d.type === 'affiliation') return 100;
    if (d.type === 'appearance') return 70;
    return 120;
  }).strength(d => {
    if (d.type === 'location_of') return 0.3;
    if (d.type === 'membership') return 0.9;
    if (d.type === 'appearance') return 0.5;
    return 0.6;
  }))
  .force('charge', d3.forceManyBody().strength(d => {
    if (d.type === 'City') return -300;
    if (d.type === 'Label') return -350;
    return -220;
  }))
  .force('center', d3.forceCenter(width / 2, height / 2))
  // 轻微向心力：把松散连接 / 不相连的子图（如波士顿 Mission of Burma 一支）拉回画面中心附近
  .force('x', d3.forceX(width / 2).strength(0.06))
  .force('y', d3.forceY(height / 2).strength(0.06))
  .force('collision', d3.forceCollide().radius(d => nodeRadius(d) + 12));

function nodeRadius(d) {
  if (d.type === 'Label') return 18;
  if (d.type === 'City') return 14;
  if (d.type === 'Band') return 12;
  if (d.type === 'Venue') return 10;
  if (d.type === 'Event') return 7;
  return 9;
}

// 连线
const linkEl = root.append('g')
  .selectAll('line')
  .data(filteredLinks)
  .join('line')
  .attr('class', 'link')
  .attr('stroke', d => LINK_COLORS[d.type] || '#666')
  .attr('stroke-width', d => d.type === 'membership' ? 1.5 : d.type === 'location_of' ? 0.8 : d.type === 'appearance' ? 0.9 : 1.2)
  .attr('stroke-dasharray', d => d.type === 'location_of' ? '3,4' : d.type === 'succession' ? '6,3' : d.type === 'appearance' ? '1,3' : null);

// 节点
const nodeEl = root.append('g')
  .selectAll('g')
  .data(filteredNodes)
  .join('g')
  .attr('class', 'node')
  .call(d3.drag()
    .on('start', (e, d) => { if (!e.active) sim.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
    .on('drag',  (e, d) => { d.fx = e.x; d.fy = e.y; })
    .on('end',   (e, d) => { if (!e.active) sim.alphaTarget(0); d.fx = null; d.fy = null; })
  );

nodeEl.append('circle')
  .attr('r', nodeRadius)
  .attr('fill', d => COLORS[d.type] || '#888')
  .attr('fill-opacity', 0.85)
  .attr('stroke', d => COLORS[d.type] || '#888')
  .attr('stroke-width', 1.5)
  .attr('stroke-opacity', 0.4);

nodeEl.append('text')
  .text(d => d.label)
  .attr('dy', d => nodeRadius(d) + 11)
  .attr('text-anchor', 'middle')
  .attr('font-size', d => d.type === 'Label' ? 10 : d.type === 'City' ? 9 : 9)
  .attr('fill', d => d.type === 'City' ? '#7ab87a' : '#b0aaa0')
  .attr('letter-spacing', '0.04em');

// Tooltip & highlight
const tooltip = document.getElementById('tooltip');
const ttName = document.getElementById('tt-name');
const ttType = document.getElementById('tt-type');
const ttDetail = document.getElementById('tt-detail');

const typeZH = { Band:'乐队', Person:'人物', Label:'厂牌', City:'城市', Project:'项目', Venue:'场地', Event:'事件' };

// 高亮某个节点及其直接关系（鼠标悬停与触屏点击共用）
function highlightNode(d) {
  const connected = new Set([d.id]);
  filteredLinks.forEach(l => {
    const sid = l.source.id || l.source;
    const tid = l.target.id || l.target;
    if (sid === d.id || tid === d.id) { connected.add(sid); connected.add(tid); }
  });
  nodeEl.classed('dimmed', n => !connected.has(n.id));
  nodeEl.classed('highlighted', n => connected.has(n.id));
  linkEl.classed('dimmed', l => (l.source.id || l.source) !== d.id && (l.target.id || l.target) !== d.id);
  linkEl.classed('highlighted', l => (l.source.id || l.source) === d.id || (l.target.id || l.target) === d.id);

  ttName.textContent = d.label;
  ttType.textContent = typeZH[d.type];
  ttType.style.color = COLORS[d.type];
  ttDetail.textContent = d.detail || '';
  tooltip.style.opacity = 1;
}

function clearHighlight() {
  nodeEl.classed('dimmed', false).classed('highlighted', false);
  linkEl.classed('dimmed', false).classed('highlighted', false);
  tooltip.style.opacity = 0;
}

// 把提示框定位到指定屏幕坐标（避免溢出视口）
function positionTooltip(clientX, clientY) {
  const ttW = tooltip.offsetWidth || 260;
  const ttH = tooltip.offsetHeight || 120;
  let x = clientX + 16, y = clientY - 8;
  if (x + ttW > window.innerWidth)  x = clientX - ttW - 16;
  if (x < 8) x = 8;
  if (y + ttH > window.innerHeight) y = window.innerHeight - ttH - 8;
  if (y < 8) y = 8;
  tooltip.style.left = x + 'px';
  tooltip.style.top  = y + 'px';
}

nodeEl
  .on('mouseover', (e, d) => highlightNode(d))
  .on('mousemove', e => positionTooltip(e.clientX, e.clientY))
  .on('mouseout', clearHighlight)
  // 触屏：点击节点高亮并显示详情；阻止冒泡，以免触发背景的清除
  .on('click', function(e, d) {
    e.stopPropagation();
    highlightNode(d);
    const p = (e.touches && e.touches[0]) || e;
    positionTooltip(p.clientX ?? window.innerWidth / 2, p.clientY ?? window.innerHeight / 2);
  });

// 点击空白处清除高亮（移动端无 mouseout 时尤其重要）
svg.on('click', clearHighlight);

// tick
sim.on('tick', () => {
  linkEl
    .attr('x1', d => d.source.x).attr('y1', d => d.source.y)
    .attr('x2', d => d.target.x).attr('y2', d => d.target.y);
  nodeEl.attr('transform', d => `translate(${d.x},${d.y})`);
});

// 统计
document.getElementById('node-count').textContent = filteredNodes.length;
document.getElementById('link-count').textContent = filteredLinks.length;

// 小屏初始缩小，让整张网络在视口内可见
const initialScale = window.innerWidth < 768 ? 0.45 : 0.85;
svg.call(zoom.transform, d3.zoomIdentity.translate(width/2, height/2).scale(initialScale).translate(-width/2, -height/2));

// 控制按钮
document.getElementById('btn-zoom-in').addEventListener('click', () =>
  svg.transition().call(zoom.scaleBy, 1.4));
document.getElementById('btn-zoom-out').addEventListener('click', () =>
  svg.transition().call(zoom.scaleBy, 0.7));
document.getElementById('btn-reset').addEventListener('click', () =>
  svg.transition().duration(600).call(zoom.transform, d3.zoomIdentity.translate(window.innerWidth/2, window.innerHeight/2).scale(window.innerWidth < 768 ? 0.45 : 0.85).translate(-window.innerWidth/2, -window.innerHeight/2)));


// ── Scene 叠加 ──
const sceneListEl = document.getElementById('scene-list');
scenes.forEach(sc => {
  const btn = document.createElement('button');
  btn.className = 'scene-btn';
  btn.textContent = sc.label;
  btn.dataset.scId = sc.id;
  btn.onclick = () => activateScene(sc, btn);
  sceneListEl.appendChild(btn);
});

// 折叠/展开场景面板（移动端默认收起，只留一个标题条）
const scenePanel = document.getElementById('scene-panel');
const sceneTitle = document.getElementById('scene-title');
sceneTitle.addEventListener('click', () => scenePanel.classList.toggle('collapsed'));
// 点击面板以外的任意区域收起展开的场景面板
document.addEventListener('click', e => {
  if (!scenePanel.contains(e.target)) scenePanel.classList.add('collapsed');
});
const isMobile = () => window.innerWidth < 768;
if (isMobile()) scenePanel.classList.add('collapsed');

function activateScene(sc, btn) {
  if (activeScene === sc.id) { clearScene(); return; }
  activeScene = sc.id;
  document.querySelectorAll('.scene-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const inScene = new Set(sc.nodes);
  nodeEl.classed('scene-lit', d => inScene.has(d.id));
  nodeEl.classed('scene-dim', d => !inScene.has(d.id));
  linkEl.style('opacity', l =>
    inScene.has(l.source.id) && inScene.has(l.target.id) ? 0.8 : 0.04);
  // 移动端选定后自动收起面板，露出图形
  if (isMobile()) scenePanel.classList.add('collapsed');
}

function clearScene() {
  activeScene = null;
  document.querySelectorAll('.scene-btn').forEach(b => b.classList.remove('active'));
  nodeEl.classed('scene-lit', false).classed('scene-dim', false);
  linkEl.style('opacity', null);
}

window.addEventListener('resize', () => {
  const w = window.innerWidth, h = window.innerHeight;
  sim.force('center', d3.forceCenter(w/2, h/2));
  sim.force('x', d3.forceX(w/2).strength(0.06));
  sim.force('y', d3.forceY(h/2).strength(0.06));
  sim.alpha(0.3).restart();
});
</script>
</body>
</html>
