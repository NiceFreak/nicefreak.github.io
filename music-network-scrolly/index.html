<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>独立音乐关系网络</title>
  <script src="./d3.min.js"></script>
  <script src="./scrollama.min.js"></script>
  <script src="./data.js"></script>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f6efe4;
      --muted: #b6aa9c;
      --soft: #756f67;
      --paper: #121416;
      --paper-2: #191b1d;
      --line: rgba(246, 239, 228, 0.14);
      --red: #e35f4f;
      --teal: #4fa8a0;
      --gold: #c9a94e;
      --green: #7ab87a;
      --pink: #cf6f8f;
      --blue: #5b9bd5;
      --violet: #a07cc5;
      --orange: #d58a4b;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: var(--paper);
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-width: 320px;
      background: linear-gradient(135deg, #121416 0%, #171719 44%, #101817 100%);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      letter-spacing: 0;
      overflow-x: hidden;
    }

    button,
    input {
      font: inherit;
    }

    .app {
      width: 100%;
    }

    .viz {
      position: sticky;
      top: 0;
      z-index: 5;
      height: min(62svh, 620px);
      min-height: 360px;
      padding: calc(12px + var(--safe-top)) 12px 10px;
      background:
        linear-gradient(180deg, rgba(18, 20, 22, 0.98), rgba(18, 20, 22, 0.9) 72%, rgba(18, 20, 22, 0.08));
      border-bottom: 1px solid var(--line);
    }

    .viz-inner {
      position: relative;
      height: 100%;
      min-height: 0;
      overflow: hidden;
      border: 1px solid var(--line);
      background:
        linear-gradient(rgba(246, 239, 228, 0.028) 1px, transparent 1px),
        linear-gradient(90deg, rgba(246, 239, 228, 0.024) 1px, transparent 1px),
        linear-gradient(155deg, rgba(22, 24, 26, 0.92), rgba(11, 17, 17, 0.98));
      background-size: 32px 32px, 32px 32px, auto;
      border-radius: 8px;
      touch-action: none;
    }

    .topbar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 3;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: start;
      padding: 12px;
      pointer-events: none;
      background: linear-gradient(180deg, rgba(17, 16, 14, 0.98) 0%, rgba(17, 16, 14, 0.88) 70%, transparent 100%);
    }

    .title {
      min-width: 0;
    }

    h1 {
      margin: 0;
      max-width: 18rem;
      color: var(--ink);
      font-size: clamp(17px, 5vw, 28px);
      line-height: 1.08;
      font-weight: 780;
      letter-spacing: 0;
    }

    .subtitle {
      margin-top: 6px;
      max-width: 24rem;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.45;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(3.2rem, auto));
      gap: 6px;
      pointer-events: auto;
    }

    .stat {
      min-width: 0;
      padding: 7px 8px;
      border: 1px solid rgba(243, 239, 230, 0.12);
      background: rgba(20, 19, 17, 0.72);
      border-radius: 6px;
      text-align: right;
    }

    .stat b {
      display: block;
      color: var(--ink);
      font-size: 14px;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .stat span {
      display: block;
      margin-top: 4px;
      color: var(--soft);
      font-size: 9px;
      line-height: 1;
      white-space: nowrap;
    }

    .legend {
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: 12px;
      z-index: 3;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      pointer-events: none;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      max-width: 10rem;
      padding: 5px 7px;
      border: 1px solid rgba(243, 239, 230, 0.12);
      background: rgba(18, 17, 15, 0.7);
      border-radius: 999px;
      color: var(--muted);
      font-size: 10px;
      line-height: 1;
    }

    .legend-dot {
      width: 8px;
      height: 8px;
      flex: 0 0 auto;
      border-radius: 50%;
    }

    .legend-label {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .controls {
      position: absolute;
      top: 100px;
      right: 12px;
      z-index: 4;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .control-btn {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(243, 239, 230, 0.16);
      border-radius: 6px;
      background: rgba(17, 16, 14, 0.72);
      color: var(--ink);
      cursor: pointer;
      font-size: 17px;
      line-height: 1;
      touch-action: manipulation;
    }

    .control-btn:active {
      transform: translateY(1px);
    }

    .graph {
      width: 100%;
      height: 100%;
      display: block;
    }

    .link {
      stroke-linecap: round;
      transition: opacity 160ms ease, stroke-width 160ms ease;
    }

    .node {
      cursor: pointer;
      transition: opacity 160ms ease;
    }

    .node circle {
      vector-effect: non-scaling-stroke;
      transition: r 160ms ease, stroke-width 160ms ease;
    }

    .node-dot {
      fill-opacity: 0.84;
    }

    .node text {
      fill: rgba(243, 239, 230, 0.72);
      paint-order: stroke;
      stroke: rgba(10, 12, 13, 0.9);
      stroke-width: 2px;
      stroke-linejoin: round;
      font-size: 8px;
      font-weight: 650;
      pointer-events: none;
      user-select: none;
      transition: opacity 360ms ease;
    }

    .detail-panel {
      position: absolute;
      left: 12px;
      bottom: 12px;
      z-index: 4;
      width: min(340px, calc(100% - 24px));
      padding: 12px;
      border: 1px solid rgba(243, 239, 230, 0.16);
      border-radius: 6px;
      background: rgba(17, 18, 18, 0.88);
      color: var(--ink);
      backdrop-filter: blur(10px);
    }

    .detail-panel strong {
      display: block;
      font-size: 14px;
      line-height: 1.2;
    }

    .detail-panel .type {
      display: inline-block;
      margin-top: 7px;
      color: var(--muted);
      font-size: 10px;
      line-height: 1;
    }

    .detail-panel .meta {
      margin-top: 9px;
      color: #c9c1b3;
      font-size: 11px;
      line-height: 1.45;
    }

    .detail-panel .desc {
      margin: 9px 0 0;
      color: #efe6d8;
      font-size: 12px;
      line-height: 1.55;
    }

    .story {
      position: relative;
      z-index: 2;
      padding: 0 16px calc(40px + var(--safe-bottom));
    }

    .step {
      min-height: 76svh;
      display: grid;
      align-content: center;
      padding: 28px 0;
      opacity: 0.42;
      transition: opacity 300ms ease;
    }

    .step.is-active {
      opacity: 1;
    }

    .step-copy {
      max-width: 34rem;
      padding: 18px 0 18px 16px;
      border-left: 2px solid rgba(243, 239, 230, 0.18);
    }

    .step.is-active .step-copy {
      border-left-color: var(--accent, var(--gold));
    }

    .kicker {
      margin: 0 0 10px;
      color: var(--accent, var(--gold));
      font-size: 11px;
      line-height: 1.2;
      font-weight: 760;
      text-transform: uppercase;
    }

    .step h2 {
      margin: 0;
      color: var(--ink);
      font-size: clamp(24px, 8vw, 54px);
      line-height: 0.98;
      font-weight: 820;
      letter-spacing: 0;
      overflow-wrap: anywhere;
    }

    .step p {
      margin: 14px 0 0;
      color: #d6cdc0;
      font-size: 15px;
      line-height: 1.72;
    }

    .step .scene-facts {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px;
    }

    .fact {
      padding: 6px 8px;
      border: 1px solid rgba(243, 239, 230, 0.13);
      border-radius: 999px;
      color: #bdb3a6;
      background: rgba(243, 239, 230, 0.04);
      font-size: 11px;
      line-height: 1;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .empty-state {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--muted);
      text-align: center;
      font-size: 14px;
      line-height: 1.6;
    }

    [hidden] {
      display: none !important;
    }

    @media (min-width: 900px) {
      body {
        background: linear-gradient(135deg, #121416 0%, #191819 48%, #101817 100%);
      }

      .app {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(360px, 34vw);
        align-items: start;
      }

      .viz {
        height: 100svh;
        min-height: 620px;
        padding: 18px;
        border-bottom: 0;
        border-right: 1px solid var(--line);
      }

      .viz-inner {
        border-radius: 8px;
      }

      .topbar {
        padding: 18px;
      }

      h1 {
        max-width: 28rem;
      }

      .subtitle {
        font-size: 12px;
      }

      .legend {
        left: auto;
        right: 18px;
        bottom: 18px;
        max-width: 320px;
        justify-content: flex-end;
      }

      .controls {
        top: 122px;
        right: 18px;
      }

      .story {
        min-height: 100svh;
        padding: 0 clamp(20px, 3vw, 38px) 8svh;
      }

      .step {
        min-height: 100svh;
      }

      .step-copy {
        padding-left: 18px;
      }
    }

    @media (max-width: 520px) {
      .viz {
        height: 60svh;
        min-height: 336px;
        padding-left: 8px;
        padding-right: 8px;
      }

      .topbar {
        grid-template-columns: 1fr;
        gap: 8px;
      }

      .stats {
        width: min(100%, 17rem);
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .stat {
        text-align: left;
      }

      .controls {
        top: auto;
        bottom: 54px;
        right: 10px;
      }

      .control-btn {
        width: 34px;
        height: 34px;
      }

      .legend {
        display: none;
      }

      .story {
        padding-left: 14px;
        padding-right: 14px;
      }

      .step {
        min-height: 56svh;
        align-content: start;
        padding: 24px 0 52px;
      }

      .step h2 {
        font-size: clamp(24px, 9vw, 34px);
        line-height: 1.04;
      }

      .step p {
        font-size: 14px;
      }

      .detail-panel {
        left: 10px;
        right: 56px;
        bottom: 10px;
        width: auto;
        max-height: 132px;
        overflow: auto;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="viz" aria-label="关系网络图">
      <div class="viz-inner" id="viz">
        <div class="topbar">
          <div class="title">
            <h1>我们的乐队，也可以成为你的生活</h1>
            <div class="subtitle" id="sceneLine">从表格资料整理出的乐队、人物、厂牌、场地与事件。</div>
          </div>
          <div class="stats" aria-label="图谱统计">
            <div class="stat"><b id="nodeCount">0</b><span>节点</span></div>
            <div class="stat"><b id="edgeCount">0</b><span>关系</span></div>
            <div class="stat"><b id="sceneCount">0</b><span>段落</span></div>
          </div>
        </div>
        <div class="controls" aria-label="图谱控制">
          <button class="control-btn" id="zoomIn" type="button" title="放大" aria-label="放大">+</button>
          <button class="control-btn" id="zoomOut" type="button" title="缩小" aria-label="缩小">-</button>
          <button class="control-btn" id="zoomReset" type="button" title="重置视图" aria-label="重置视图">0</button>
        </div>
        <svg class="graph" id="graph" role="img" aria-label="自动推断的音乐文化关系网络"></svg>
        <div class="legend" id="legend" aria-hidden="true"></div>
        <aside class="detail-panel" id="detailPanel" aria-live="polite">
          <strong>点一个节点查看资料</strong>
          <span class="type">乐队 / 人物 / 厂牌 / 场地 / 事件</span>
          <div class="desc">桌面端悬停，移动端点击节点；相关节点和关系会同步高亮。</div>
        </aside>
        <div class="empty-state" id="emptyState" hidden>这份表格暂时没有形成可展示的关系网络。</div>
      </div>
    </section>
    <section class="story" id="story" aria-label="滚动叙事"></section>
  </main>

  <script>
    (() => {
      const workbook = window.RAW_WORKBOOK || { sheets: [] };
      const colors = ["#5b9bd5", "#c9a94e", "#7ab87a", "#a07cc5", "#4fa8a0", "#cf6f8f", "#e35f4f", "#d58a4b", "#8fbf6a", "#d08cc0"];
      const root = document.documentElement;
      const graphEl = document.getElementById("graph");
      const vizEl = document.getElementById("viz");
      const storyEl = document.getElementById("story");
      const detailPanel = document.getElementById("detailPanel");
      const sceneLine = document.getElementById("sceneLine");
      const emptyState = document.getElementById("emptyState");

      const clean = (value) => String(value ?? "").replace(/\s+/g, " ").trim();
      const compact = (value) => clean(value).toLowerCase().replace(/[*＊]/g, "").replace(/[()（）\[\]【】{}<>《》]/g, " ").replace(/[\/\\|:：,，;；._\-]+/g, " ");
      const hasHan = (value) => /[\u3400-\u9fff]/.test(String(value ?? ""));
      const nonEmpty = (value) => clean(value) !== "";
      const unique = (arr) => [...new Set(arr.filter(nonEmpty))];
      const rowKey = (sheetName, rowNumber) => `${sheetName}#${rowNumber}`;

      function splitMulti(value) {
        const text = clean(value);
        if (!text) return [];
        return text
          .split(/[,，;；、\n]+/)
          .map((part) => clean(part))
          .filter(Boolean);
      }

      function containsAny(text, tokens) {
        const value = compact(text);
        return tokens.some((token) => value.includes(token));
      }

      function isInstructionSheet(sheet) {
        const name = clean(sheet.name);
        const rows = sheet.rows || [];
        const maxWidth = Math.max(0, ...rows.map((row) => row.filter(nonEmpty).length));
        return containsAny(name, ["说明", "readme", "instruction", "instructions", "intro"]) || maxWidth <= 1;
      }

      function isSampleRow(row) {
        return Object.values(row.object || {}).some((value) => /示例|样例|sample/i.test(clean(value)));
      }

      function readableType(type) {
        const value = clean(type);
        if (containsAny(value, ["乐队", "band"])) return "乐队";
        if (containsAny(value, ["人物", "成员", "人名", "person", "artist"])) return "人物";
        if (containsAny(value, ["厂牌", "label", "records"])) return "厂牌";
        if (containsAny(value, ["场地", "venue", "livehouse", "空间"])) return "场地";
        if (containsAny(value, ["场景", "scene", "本地", "跨地域", "虚拟"]) || value === "本地") return "场景";
        if (containsAny(value, ["事件", "event", "演出"])) return "事件";
        if (containsAny(value, ["城市", "city", "地理"])) return "城市";
        if (containsAny(value, ["项目", "project", "组织"])) return "项目";
        return value || "实体";
      }

      function metaValueText(value) {
        if (Array.isArray(value)) return value.map(metaValueText).filter(Boolean).join(" / ");
        if (value && typeof value === "object") return JSON.stringify(value);
        return clean(value);
      }

      function fieldRank(key) {
        const k = clean(key);
        if (/一句话简介|场景描述|边界依据|事件描述|对场景的意义|detail|description|summary/i.test(k)) return 100;
        if (/备注|note/i.test(k)) return 80;
        if (/担任|合作形式|风格|所在城市|地理范围|成立年份|活跃|时间|年份|来源章节|章节来源/i.test(k)) return 55;
        if (/英文名|别名|旗下|创始人|是否/i.test(k)) return 35;
        return 10;
      }

      function nodeDescription(node) {
        return Object.entries(node.meta || {})
          .filter(([key, value]) => !key.startsWith("_") && fieldRank(key) >= 80 && nonEmpty(metaValueText(value)))
          .sort((a, b) => fieldRank(b[0]) - fieldRank(a[0]))
          .map(([, value]) => metaValueText(value))
          .find(Boolean) || "";
      }

      function compactMetaPairs(node, limit = 6) {
        return Object.entries(node.meta || {})
          .filter(([key, value]) => !key.startsWith("_") && fieldRank(key) < 100 && nonEmpty(metaValueText(value)))
          .sort((a, b) => fieldRank(b[0]) - fieldRank(a[0]))
          .slice(0, limit);
      }

      function findHeader(headers, tokens) {
        return headers.find((header) => containsAny(header, tokens)) || "";
      }

      function workbookSceneRows(rawWorkbook) {
        const sheet = (rawWorkbook.sheets || []).find((item) => containsAny(item.name, ["场景", "scene"]));
        if (!sheet) return [];
        const headerIndex = bestHeaderRow(sheet.rows || []);
        if (headerIndex < 0) return [];
        const headers = (sheet.rows[headerIndex] || []).map((h, i) => clean(h) || `Column ${i + 1}`);
        const idHeader = findHeader(headers, ["场景id", "scene id"]);
        const titleHeader = findHeader(headers, ["场景名", "名称", "name", "title"]);
        const typeHeader = findHeader(headers, ["场景类型", "类型", "type"]);
        const rangeHeader = findHeader(headers, ["地理范围", "城市", "范围", "range"]);
        const startHeader = findHeader(headers, ["起始", "开始", "start"]);
        const endHeader = findHeader(headers, ["结束", "end"]);
        const coreIdHeader = findHeader(headers, ["核心实体id", "核心", "实体id", "ids"]);
        const descHeader = findHeader(headers, ["场景描述", "边界依据", "描述", "description"]);
        return (sheet.rows || []).slice(headerIndex + 1).map((values, index) => {
          const row = {};
          headers.forEach((header, i) => {
            row[header] = clean(values[i]);
          });
          return {
            id: row[idHeader] || `scene-row-${index + 1}`,
            title: row[titleHeader],
            type: row[typeHeader],
            range: row[rangeHeader],
            start: row[startHeader],
            end: row[endHeader],
            coreIds: splitMulti(row[coreIdHeader]),
            description: row[descHeader],
          };
        }).filter((scene) => scene.title && scene.coreIds.length && !/示例|样例|sample/i.test(scene.title));
      }

      function isRecordLike(header) {
        return containsAny(header, ["记录", "row", "record", "序号", "编号"]) && !containsAny(header, ["实体", "entity", "参与", "核心", "成员", "人物", "乐队", "厂牌", "场地"]);
      }

      function isEventLike(header) {
        return containsAny(header, ["事件", "event", "演出", "session"]);
      }

      function idScore(header, values) {
        const h = compact(header);
        const sample = values.filter(nonEmpty).slice(0, 80);
        if (!sample.length) return 0;
        let score = 0;
        if (/(^|\s)(id|ids)(\s|$)/i.test(h) || /id/.test(h) || /编号|代码|标识/.test(header)) score += 4;
        if (containsAny(header, ["实体", "entity", "参与", "核心", "source", "target", "from", "to", "成员", "人物", "乐队", "厂牌", "场地", "场景", "事件"])) score += 1.5;
        if (isRecordLike(header)) score -= 2;
        const patternHits = sample.filter((v) => /^[A-Za-z\u4e00-\u9fff]{0,4}\d{1,5}[A-Za-z0-9_-]*$/.test(clean(v)) || /^[A-Za-z]{1,6}\d{1,6}(?:[,，;；、]\s*[A-Za-z]{1,6}\d{1,6})*$/.test(clean(v))).length;
        score += (patternHits / sample.length) * 2.2;
        const uniqueRatio = new Set(sample.map(clean)).size / sample.length;
        if (uniqueRatio > 0.72) score += 0.7;
        if (sample.some((v) => splitMulti(v).length > 1)) score += 0.5;
        return score;
      }

      function nameScore(header, values) {
        const sample = values.filter(nonEmpty).slice(0, 80);
        if (!sample.length) return 0;
        let score = 0;
        if (containsAny(header, ["名称", "名字", "姓名", "名字", "名 ", "名*", "name", "title", "label", "alias", "别名"])) score += 4;
        if (containsAny(header, ["简介", "描述", "备注", "来源", "年份", "城市", "原因"])) score -= 2.2;
        const natural = sample.filter((v) => {
          const text = clean(v);
          return text.length >= 2 && text.length <= 52 && !/^\d{2,4}/.test(text) && !/^[A-Za-z]{1,6}\d{1,6}$/.test(text);
        }).length;
        score += (natural / sample.length) * 1.5;
        return score;
      }

      function typeScore(header, values) {
        const sample = values.filter(nonEmpty).slice(0, 80);
        if (!sample.length) return 0;
        let score = 0;
        if (containsAny(header, ["类型", "类别", "分类", "type", "kind", "category"])) score += 4;
        if (containsAny(header, ["风格", "genre", "role", "担任", "身份"])) score += 0.8;
        const uniqueRatio = new Set(sample.map(clean)).size / sample.length;
        if (uniqueRatio < 0.55) score += 0.9;
        return score;
      }

      function relationScore(header, values) {
        const sample = values.filter(nonEmpty).slice(0, 80);
        let score = 0;
        if (containsAny(header, ["关系", "合作", "形式", "relation", "relationship", "link", "edge", "role", "担任", "签约", "旗下", "前身", "成员", "参与", "核心"])) score += 4;
        if (containsAny(header, ["备注", "来源", "描述", "简介"])) score -= 1.2;
        const uniqueRatio = sample.length ? new Set(sample.map(clean)).size / sample.length : 1;
        if (sample.length && uniqueRatio < 0.8) score += 0.5;
        return score;
      }

      function yearScore(header) {
        return containsAny(header, ["年份", "year", "时间", "date", "起始", "结束", "开始", "加入", "离开"]) ? 1 : 0;
      }

      function semanticSubject(header) {
        const h = clean(header).replace(/[*＊]/g, "");
        const beforeId = h.replace(/id|ID|Ids|IDs|编号|代码|标识/g, "");
        const beforeName = beforeId.replace(/名称|名字|姓名|英文名|别名|name|title|label/gi, "");
        const beforeHint = beforeName.replace(/（.*?）|\(.*?\)/g, "").replace(/逗号隔开|可多个|如有/g, "");
        const short = clean(beforeHint);
        if (short) return short.slice(0, 18);
        return clean(header).slice(0, 18);
      }

      function slotMarker(header) {
        const h = compact(header);
        const raw = clean(header);
        if (/(source|from|起点|来源实体|实体\s*a|实体a|\ba\b|甲)/i.test(h) || /实体A/.test(raw)) return "a";
        if (/(target|to|终点|目标实体|实体\s*b|实体b|\bb\b|乙)/i.test(h) || /实体B/.test(raw)) return "b";
        if (containsAny(header, ["source", "from", "起点"])) return "a";
        if (containsAny(header, ["target", "to", "终点"])) return "b";
        return "";
      }

      function bestHeaderRow(rows) {
        let best = { index: -1, score: -Infinity };
        rows.slice(0, 16).forEach((row, index) => {
          const cells = row.map(clean);
          const filled = cells.filter(Boolean);
          if (filled.length < 2) return;
          let score = filled.length + new Set(filled).size * 0.6;
          filled.forEach((cell) => {
            if (containsAny(cell, ["id", "名称", "名字", "姓名", "类型", "关系", "年份", "城市", "source", "target", "from", "to", "实体", "参与", "核心"])) score += 1.4;
            if (cell.length > 34) score -= 1;
          });
          const nextRows = rows.slice(index + 1, index + 8);
          const widthMatch = nextRows.filter((r) => r.filter(nonEmpty).length >= Math.max(2, filled.length * 0.45)).length;
          score += widthMatch;
          if (score > best.score) best = { index, score };
        });
        return best.index;
      }

      function makeTables(rawWorkbook) {
        return rawWorkbook.sheets.filter((sheet) => !isInstructionSheet(sheet)).map((sheet) => {
          const headerIndex = bestHeaderRow(sheet.rows || []);
          if (headerIndex < 0) {
            return { sheetName: sheet.name, headers: [], rows: [], notes: (sheet.rows || []).flat().filter(nonEmpty) };
          }
          const headers = (sheet.rows[headerIndex] || []).map((h, i) => clean(h) || `Column ${i + 1}`);
          const rows = (sheet.rows || []).slice(headerIndex + 1).map((values, localIndex) => {
            const object = {};
            headers.forEach((header, i) => {
              object[header] = clean(values[i]);
            });
            return {
              sheetName: sheet.name,
              rowNumber: headerIndex + localIndex + 2,
              values,
              object,
            };
          }).filter((row) => headers.some((header) => nonEmpty(row.object[header])) && !isSampleRow(row));
          const columns = headers.map((header, index) => {
            const values = rows.map((row) => row.object[header]);
            return {
              header,
              index,
              values,
              idScore: idScore(header, values),
              nameScore: nameScore(header, values),
              typeScore: typeScore(header, values),
              relationScore: relationScore(header, values),
              yearScore: yearScore(header),
              marker: slotMarker(header),
              subject: semanticSubject(header),
              multiRatio: values.length ? values.filter((v) => splitMulti(v).length > 1).length / values.length : 0,
              recordLike: isRecordLike(header),
              eventLike: isEventLike(header),
            };
          });
          return { sheetName: sheet.name, headers, rows, columns };
        }).filter((table) => table.headers.length && table.rows.length);
      }

      function getColumn(table, header) {
        return table.columns.find((column) => column.header === header);
      }

      function pickNameForId(table, idColumn, usedNames = new Set()) {
        const idSubject = compact(idColumn.subject);
        let best = null;
        table.columns.forEach((column) => {
          if (usedNames.has(column.header)) return;
          if (column.header === idColumn.header) return;
          if (column.nameScore < 2) return;
          const columnSubject = compact(column.subject);
          let score = column.nameScore;
          if (idColumn.marker && column.marker === idColumn.marker) score += 4;
          if (idSubject && columnSubject && (idSubject.includes(columnSubject) || columnSubject.includes(idSubject))) score += 2.4;
          score -= Math.abs(column.index - idColumn.index) * 0.18;
          if (!best || score > best.score) best = { column, score };
        });
        return best ? best.column : null;
      }

      function pickTypeForId(table, idColumn) {
        const idSubject = compact(idColumn.subject);
        let best = null;
        table.columns.forEach((column) => {
          if (column.header === idColumn.header) return;
          if (column.typeScore < 2.5) return;
          const columnSubject = compact(column.subject);
          let score = column.typeScore;
          if (idColumn.marker && column.marker === idColumn.marker) score += 4;
          if (idSubject && columnSubject && (idSubject.includes(columnSubject) || columnSubject.includes(idSubject))) score += 1.8;
          score -= Math.abs(column.index - idColumn.index) * 0.12;
          if (!best || score > best.score) best = { column, score };
        });
        return best ? best.column : null;
      }

      function inferEntitySlots(table) {
        const idColumns = table.columns
          .filter((column) => column.idScore >= 3.2)
          .filter((column) => !column.recordLike || column.eventLike);
        const usedNames = new Set();
        return idColumns.map((idColumn) => {
          const nameColumn = pickNameForId(table, idColumn, usedNames);
          if (nameColumn) usedNames.add(nameColumn.header);
          const typeColumn = pickTypeForId(table, idColumn);
          return {
            idColumn,
            nameColumn,
            typeColumn,
            marker: idColumn.marker,
            subject: idColumn.subject || table.sheetName,
            confidence: idColumn.idScore + (nameColumn ? nameColumn.nameScore : 0) + (typeColumn ? typeColumn.typeScore * 0.4 : 0),
          };
        }).filter((slot) => slot.nameColumn || slot.idColumn.multiRatio > 0.08 || slot.idColumn.eventLike);
      }

      function primarySlot(table, slots) {
        const usable = slots.filter((slot) => !slot.idColumn.recordLike || slot.idColumn.eventLike);
        if (!usable.length) return null;
        let best = null;
        usable.forEach((slot) => {
          let score = slot.confidence;
          if (!slot.marker) score += 1.1;
          if (slot.idColumn.index <= 1) score += 1.6;
          if (slot.nameColumn && slot.nameColumn.index <= 2) score += 0.8;
          if (slot.idColumn.multiRatio > 0.1) score -= 2.5;
          if (slot.idColumn.recordLike && slot.idColumn.eventLike) score += 0.7;
          if (!best || score > best.score) best = { slot, score };
        });
        return best ? best.slot : null;
      }

      function rowMeta(table, row, exclude = new Set()) {
        const meta = {};
        table.headers.forEach((header) => {
          if (exclude.has(header)) return;
          const value = row.object[header];
          if (nonEmpty(value)) meta[header] = value;
        });
        meta._sheet = table.sheetName;
        meta._row = row.rowNumber;
        return meta;
      }

      function addMeta(target, incoming, prefix = "") {
        Object.entries(incoming || {}).forEach(([key, value]) => {
          if (!nonEmpty(value) && typeof value !== "number") return;
          const finalKey = prefix ? `${prefix}.${key}` : key;
          if (!(finalKey in target)) {
            target[finalKey] = value;
            return;
          }
          const current = target[finalKey];
          if (Array.isArray(current)) {
            if (!current.some((item) => JSON.stringify(item) === JSON.stringify(value))) current.push(value);
          } else if (JSON.stringify(current) !== JSON.stringify(value)) {
            target[finalKey] = [current, value];
          }
        });
      }

      function createGraph(rawWorkbook) {
        const tables = makeTables(rawWorkbook);
        const nodeMap = new Map();
        const edgeMap = new Map();
        const clusterHints = new Map();

        function ensureNode(input) {
          const id = clean(input.id || input.name);
          if (!id) return null;
          const existing = nodeMap.get(id) || {
            id,
            label: clean(input.name) || id,
            type: clean(input.type) || clean(input.fallbackType) || "entity",
            meta: {},
            degree: 0,
          };
          if (nonEmpty(input.name) && (!existing.label || existing.label === id || existing.label.length > clean(input.name).length + 12)) existing.label = clean(input.name);
          if (nonEmpty(input.type) && existing.type === "entity") existing.type = clean(input.type);
          if (nonEmpty(input.type) && existing.type !== clean(input.type)) {
            addMeta(existing.meta, { inferredTypes: clean(input.type) });
          }
          if (input.meta) addMeta(existing.meta, input.meta, input.metaPrefix || "");
          if (input.sourceRow) {
            const rows = existing.meta._sourceRows || [];
            if (!rows.includes(input.sourceRow)) rows.push(input.sourceRow);
            existing.meta._sourceRows = rows;
          }
          nodeMap.set(id, existing);
          return existing;
        }

        function edgeId(source, target, type, key) {
          return `${source}||${target}||${type || "related"}||${key || ""}`;
        }

        function ensureEdge(input) {
          const source = clean(input.source);
          const target = clean(input.target);
          if (!source || !target || source === target) return null;
          const type = clean(input.type) || "related";
          const key = input.key || "";
          const id = edgeId(source, target, type, key);
          const existing = edgeMap.get(id) || {
            id,
            source,
            target,
            type,
            meta: {},
            weight: 0,
          };
          existing.weight += Number(input.weight || 1);
          if (input.meta) addMeta(existing.meta, input.meta);
          edgeMap.set(id, existing);
          return existing;
        }

        const tableSlots = new Map();
        tables.forEach((table) => {
          const slots = inferEntitySlots(table);
          tableSlots.set(table, slots);
          const primary = primarySlot(table, slots);
          slots.forEach((slot) => {
            table.rows.forEach((row) => {
              const ids = splitMulti(row.object[slot.idColumn.header]);
              const names = slot.nameColumn ? splitMulti(row.object[slot.nameColumn.header]) : [];
              const explicitType = slot.typeColumn ? row.object[slot.typeColumn.header] : "";
              ids.forEach((id, index) => {
                const name = names[index] || (names.length === 1 ? names[0] : id);
                const fallbackType = slot.subject || table.sheetName;
                const exclude = new Set([slot.idColumn.header]);
                if (slot.nameColumn) exclude.add(slot.nameColumn.header);
                if (slot.typeColumn) exclude.add(slot.typeColumn.header);
                const ownPrimary = primary && primary.idColumn.header === slot.idColumn.header;
                ensureNode({
                  id,
                  name,
                  type: explicitType || fallbackType,
                  fallbackType,
                  meta: ownPrimary ? rowMeta(table, row, exclude) : { observedIn: table.sheetName, column: slot.idColumn.header },
                  metaPrefix: ownPrimary ? table.sheetName : "",
                  sourceRow: rowKey(table.sheetName, row.rowNumber),
                });
              });
            });
          });
        });

        tables.forEach((table) => {
          const slots = tableSlots.get(table) || [];
          const primary = primarySlot(table, slots);
          const relationColumn = table.columns
            .filter((column) => column.relationScore >= 3)
            .sort((a, b) => b.relationScore - a.relationScore || a.index - b.index)[0];
          const aSlots = slots.filter((slot) => slot.marker === "a");
          const bSlots = slots.filter((slot) => slot.marker === "b");

          if (aSlots.length && bSlots.length) {
            table.rows.forEach((row) => {
              aSlots.forEach((aSlot) => {
                bSlots.forEach((bSlot) => {
                  const aIds = splitMulti(row.object[aSlot.idColumn.header]);
                  const bIds = splitMulti(row.object[bSlot.idColumn.header]);
                  const type = relationColumn ? row.object[relationColumn.header] || relationColumn.subject : table.sheetName;
                  aIds.forEach((source) => bIds.forEach((target) => {
                    ensureEdge({
                      source,
                      target,
                      type,
                      key: rowKey(table.sheetName, row.rowNumber),
                      meta: rowMeta(table, row),
                    });
                  }));
                });
              });
            });
          }

          if (primary) {
            table.rows.forEach((row) => {
              const sourceIds = splitMulti(row.object[primary.idColumn.header]);
              slots.forEach((slot) => {
                if (slot.idColumn.header === primary.idColumn.header) return;
                if (slot.marker === "a" || slot.marker === "b") return;
                const targetIds = splitMulti(row.object[slot.idColumn.header]);
                if (!targetIds.length || !sourceIds.length) return;
                const targetNames = slot.nameColumn ? splitMulti(row.object[slot.nameColumn.header]) : [];
                const edgeType = slot.subject || relationColumn?.subject || table.sheetName;
                sourceIds.forEach((source) => targetIds.forEach((target, index) => {
                  ensureNode({
                    id: target,
                    name: targetNames[index] || target,
                    type: slot.typeColumn ? row.object[slot.typeColumn.header] : slot.subject,
                    fallbackType: slot.subject || table.sheetName,
                    meta: { observedIn: table.sheetName, column: slot.idColumn.header },
                    sourceRow: rowKey(table.sheetName, row.rowNumber),
                  });
                  ensureEdge({
                    source,
                    target,
                    type: edgeType,
                    key: rowKey(table.sheetName, row.rowNumber) + "::" + slot.idColumn.header,
                    meta: rowMeta(table, row),
                  });
                }));
              });
            });
          }

          const multiSlots = slots.filter((slot) => slot.idColumn.multiRatio > 0.08 || containsAny(slot.idColumn.header, ["参与", "核心", "逗号", "comma", "list"]));
          multiSlots.forEach((slot) => {
            table.rows.forEach((row) => {
              const ids = splitMulti(row.object[slot.idColumn.header]);
              if (ids.length < 2) return;
              const names = slot.nameColumn ? splitMulti(row.object[slot.nameColumn.header]) : [];
              ids.forEach((id, index) => {
                ensureNode({
                  id,
                  name: names[index] || id,
                  type: slot.typeColumn ? row.object[slot.typeColumn.header] : slot.subject,
                  fallbackType: slot.subject || table.sheetName,
                  meta: { observedIn: table.sheetName, column: slot.idColumn.header },
                  sourceRow: rowKey(table.sheetName, row.rowNumber),
                });
              });
              for (let i = 0; i < ids.length; i += 1) {
                for (let j = i + 1; j < ids.length; j += 1) {
                  ensureEdge({
                    source: ids[i],
                    target: ids[j],
                    type: relationColumn ? row.object[relationColumn.header] || relationColumn.subject : `${table.sheetName} 共现`,
                    key: rowKey(table.sheetName, row.rowNumber) + "::co",
                    weight: 0.75,
                    meta: rowMeta(table, row),
                  });
                }
              }
              if (primary && primary.idColumn.header !== slot.idColumn.header) {
                const sourceIds = splitMulti(row.object[primary.idColumn.header]);
                sourceIds.forEach((source) => ids.forEach((target) => {
                  ensureEdge({
                    source,
                    target,
                    type: slot.subject || table.sheetName,
                    key: rowKey(table.sheetName, row.rowNumber) + "::multi",
                    weight: 0.9,
                    meta: rowMeta(table, row),
                  });
                }));
              }
            });
          });
        });

        const nodes = [...nodeMap.values()];
        const validIds = new Set(nodes.map((node) => node.id));
        const edges = [...edgeMap.values()].filter((edge) => validIds.has(edge.source) && validIds.has(edge.target));
        nodes.forEach((node) => {
          node.degree = 0;
          node.weightedDegree = 0;
        });
        const byId = new Map(nodes.map((node) => [node.id, node]));
        edges.forEach((edge) => {
          const s = byId.get(edge.source);
          const t = byId.get(edge.target);
          if (!s || !t) return;
          s.degree += 1;
          t.degree += 1;
          s.weightedDegree += edge.weight || 1;
          t.weightedDegree += edge.weight || 1;
        });

        const clusters = inferCommunities(nodes, edges);
        clusters.forEach((cluster) => {
          cluster.nodes.forEach((id) => clusterHints.set(id, cluster.id));
        });
        nodes.forEach((node) => {
          node.cluster = clusterHints.get(node.id) || "cluster-0";
        });

        const scenes = buildScenes(nodes, edges, clusters, rawWorkbook);
        return {
          nodes,
          edges,
          clusters,
          scenes,
          tables: tables.map((table) => ({
            sheetName: table.sheetName,
            headers: table.headers,
            rows: table.rows.length,
            inferredSlots: (tableSlots.get(table) || []).map((slot) => ({
              id: slot.idColumn.header,
              name: slot.nameColumn?.header || "",
              type: slot.typeColumn?.header || "",
              subject: slot.subject,
              marker: slot.marker,
            })),
          })),
        };
      }

      function inferCommunities(nodes, edges) {
        const ids = nodes.map((node) => node.id);
        const adjacency = new Map(ids.map((id) => [id, new Map()]));
        edges.forEach((edge) => {
          const weight = edge.weight || 1;
          if (!adjacency.has(edge.source) || !adjacency.has(edge.target)) return;
          adjacency.get(edge.source).set(edge.target, (adjacency.get(edge.source).get(edge.target) || 0) + weight);
          adjacency.get(edge.target).set(edge.source, (adjacency.get(edge.target).get(edge.source) || 0) + weight);
        });
        let labels = new Map(ids.map((id) => [id, id]));
        for (let round = 0; round < 12; round += 1) {
          ids.slice().sort((a, b) => (adjacency.get(b).size - adjacency.get(a).size)).forEach((id) => {
            const counts = new Map();
            adjacency.get(id).forEach((weight, neighbor) => {
              const label = labels.get(neighbor);
              counts.set(label, (counts.get(label) || 0) + weight);
            });
            if (!counts.size) return;
            const best = [...counts.entries()].sort((a, b) => b[1] - a[1] || String(a[0]).localeCompare(String(b[0])))[0][0];
            labels.set(id, best);
          });
        }
        const grouped = new Map();
        labels.forEach((label, id) => {
          if (!grouped.has(label)) grouped.set(label, []);
          grouped.get(label).push(id);
        });
        return [...grouped.entries()]
          .map(([label, group], index) => ({
            id: `cluster-${index + 1}`,
            label,
            nodes: group,
            size: group.length,
          }))
          .sort((a, b) => b.size - a.size)
          .map((cluster, index) => ({ ...cluster, id: `cluster-${index + 1}` }));
      }

      function sceneContextIds(seedIds, adjacency, nodeById, limit = 34) {
        const ids = new Set(seedIds.filter((id) => nodeById.has(id)));
        seedIds.forEach((id) => {
          [...(adjacency.get(id) || [])]
            .sort((a, b) => (nodeById.get(b)?.degree || 0) - (nodeById.get(a)?.degree || 0))
            .slice(0, 4)
            .forEach((neighbor) => ids.add(neighbor));
        });
        return [...ids].sort((a, b) => (nodeById.get(b)?.degree || 0) - (nodeById.get(a)?.degree || 0)).slice(0, limit);
      }

      function buildScenes(nodes, edges, clusters, rawWorkbook) {
        const nodeById = new Map(nodes.map((node) => [node.id, node]));
        const adjacency = new Map(nodes.map((node) => [node.id, new Set()]));
        edges.forEach((edge) => {
          if (!adjacency.has(edge.source) || !adjacency.has(edge.target)) return;
          adjacency.get(edge.source).add(edge.target);
          adjacency.get(edge.target).add(edge.source);
        });
        const topNodes = nodes.slice().sort((a, b) => (b.weightedDegree || b.degree) - (a.weightedDegree || a.degree));
        const central = topNodes[0];
        if (!central) return [];
        const centralDesc = nodeDescription(central);
        const neighborList = [...(adjacency.get(central.id) || [])].sort((a, b) => (nodeById.get(b)?.degree || 0) - (nodeById.get(a)?.degree || 0));
        const scenes = [];
        const palette = colors;
        const sourceScenes = workbookSceneRows(rawWorkbook);
        const visibleFullEdges = edges
          .slice()
          .sort((a, b) => {
            const scoreA = (a.weight || 1) + (nodeById.get(a.source)?.degree || 0) * 0.04 + (nodeById.get(a.target)?.degree || 0) * 0.04;
            const scoreB = (b.weight || 1) + (nodeById.get(b.source)?.degree || 0) * 0.04 + (nodeById.get(b.target)?.degree || 0) * 0.04;
            return scoreB - scoreA;
          })
          .slice(0, Math.min(190, edges.length))
          .map((edge) => edge.id);
        const addScene = (scene) => {
          const ids = unique(scene.nodeIds || []);
          if (!ids.length) return;
          const edgeIds = scene.edgeIds || edges
            .filter((edge) => ids.includes(edge.source) && ids.includes(edge.target))
            .map((edge) => edge.id);
          scenes.push({
            id: `scene-${scenes.length + 1}`,
            accent: palette[scenes.length % palette.length],
            ...scene,
            nodeIds: ids,
            edgeIds: unique(edgeIds),
          });
        };

        if (sourceScenes.length) {
          sourceScenes.slice(0, 5).forEach((sourceScene, index) => {
            const ids = sceneContextIds(sourceScene.coreIds, adjacency, nodeById);
            if (!ids.length) return;
            addScene({
              mode: "source-scene",
              kicker: `资料表：场景${sourceScene.type ? ` · ${sourceScene.type}` : ""}`,
              title: sourceScene.title,
              body: sourceScene.description || [sourceScene.range, sourceScene.start && `${sourceScene.start}${sourceScene.end ? `-${sourceScene.end}` : ""}`].filter(Boolean).join(" · "),
              nodeIds: ids,
            });
          });
          addScene({
            mode: "full",
            kicker: "全景",
            title: "完整关系网",
            body: "上面的段落来自资料表中的“场景”条目。最后把视野拉开，看所有乐队、人物、厂牌、场地和事件如何接在一起。",
            nodeIds: nodes.map((node) => node.id),
            edgeIds: visibleFullEdges,
          });
          return scenes.slice(0, nodes.length < 15 ? 3 : 6);
        }

        addScene({
          mode: "intro",
          kicker: "自动导览",
          title: `${central.label}`,
          body: centralDesc || `${central.label} 连接了最多人物、厂牌、乐队或事件。先从它身边的一圈关系进入：谁把声音带出去，谁又把新的场景带回来。`,
          nodeIds: [central.id, ...neighborList.slice(0, Math.min(10, Math.max(4, neighborList.length)))],
        });

        const centralCluster = clusters.find((cluster) => cluster.nodes.includes(central.id)) || clusters[0];
        if (centralCluster) {
          const ids = centralCluster.nodes
            .slice()
            .sort((a, b) => (nodeById.get(b)?.degree || 0) - (nodeById.get(a)?.degree || 0))
            .slice(0, Math.min(28, Math.max(centralCluster.nodes.length, 8)));
          addScene({
            mode: "cluster",
            kicker: "自动分组",
            title: `${central.label} 相关网络`,
            body: "这一组关系更密集：乐队、成员、厂牌与共同出现的事件互相牵引，形成一个可以自我运转的小生态。",
            nodeIds: ids,
          });
        }

        const secondary = clusters.find((cluster) => !cluster.nodes.includes(central.id) && cluster.size >= 3);
        if (secondary && nodes.length > 14) {
          const anchor = secondary.nodes.slice().sort((a, b) => (nodeById.get(b)?.degree || 0) - (nodeById.get(a)?.degree || 0))[0];
          const anchorNode = nodeById.get(anchor);
          const anchorDesc = anchorNode ? nodeDescription(anchorNode) : "";
          addScene({
            mode: "cluster",
            kicker: "自动分组",
            title: anchorNode?.label || "另一组关系",
            body: anchorDesc || "视线移到另一组紧密连接的名字。它们未必共享同一座城市，却通过巡演、发行、成员流动或相互影响连在一起。",
            nodeIds: secondary.nodes.slice(0, 30),
          });
        }

        const bridgeNodes = nodes
          .map((node) => {
            const neighborClusters = new Set([node.cluster]);
            (adjacency.get(node.id) || new Set()).forEach((neighbor) => {
              const n = nodeById.get(neighbor);
              if (n) neighborClusters.add(n.cluster);
            });
            return { node, bridgeScore: neighborClusters.size * 4 + node.degree };
          })
          .filter((item) => item.bridgeScore > item.node.degree + 4)
          .sort((a, b) => b.bridgeScore - a.bridgeScore)
          .slice(0, 12)
          .map((item) => item.node.id);
        if (bridgeNodes.length && nodes.length > 18) {
          const bridgeContext = new Set(bridgeNodes);
          bridgeNodes.forEach((id) => {
            [...(adjacency.get(id) || [])]
              .sort((a, b) => (nodeById.get(b)?.degree || 0) - (nodeById.get(a)?.degree || 0))
              .slice(0, 4)
              .forEach((neighbor) => bridgeContext.add(neighbor));
          });
          addScene({
            mode: "bridges",
            kicker: "跨场景关系",
            title: "穿过边界的人",
            body: "有些名字不只属于一个圈子。它们把地方场景、厂牌网络和乐队谱系接到一起，让地下音乐从局部故事变成流动的网络。",
            nodeIds: [...bridgeContext],
            edgeIds: edges.filter((edge) => bridgeContext.has(edge.source) && bridgeContext.has(edge.target)).map((edge) => edge.id),
          });
        }

        addScene({
          mode: "full",
          kicker: "全景",
          title: "地下网络展开",
          body: "最后把视野拉开。这里的每个点都来自原始资料表：乐队、人物、厂牌、场地、事件和场景彼此交错，构成一张独立音乐的生活地图。",
          nodeIds: nodes.map((node) => node.id),
          edgeIds: visibleFullEdges,
        });

        return scenes.slice(0, nodes.length < 15 ? 3 : 6);
      }

      const inferred = createGraph(workbook);
      inferred.nodes.forEach((node) => {
        node.type = readableType(node.type);
      });
      window.INFERRED_SCHEMA = {
        nodes: inferred.nodes.map(({ id, type, meta }) => ({ id, type, meta })),
        edges: inferred.edges.map(({ source, target, type, meta }) => ({ source, target, type, meta })),
        clusters: inferred.clusters,
        scenes: inferred.scenes.map(({ id, title, mode, nodeIds, edgeIds }) => ({ id, title, mode, nodeIds, edgeIds })),
      };

      document.getElementById("nodeCount").textContent = inferred.nodes.length;
      document.getElementById("edgeCount").textContent = inferred.edges.length;
      document.getElementById("sceneCount").textContent = inferred.scenes.length;

      if (inferred.nodes.length < 2 || inferred.edges.length < 1) {
        emptyState.hidden = false;
        return;
      }

      const typeList = [...new Set(inferred.nodes.map((node) => node.type || "实体"))].sort((a, b) => a.localeCompare(b, "zh-Hans-CN"));
      const typeColor = new Map(typeList.map((type, index) => [type, colors[index % colors.length]]));
      const maxDegree = Math.max(1, ...inferred.nodes.map((node) => node.degree || 0));
      const nodeById = new Map(inferred.nodes.map((node) => [node.id, node]));

      renderLegend(typeList, typeColor);
      renderStory(inferred.scenes);

      const svg = d3.select(graphEl);
      const layer = svg.append("g").attr("class", "viewport");
      const linkLayer = layer.append("g").attr("class", "links");
      const nodeLayer = layer.append("g").attr("class", "nodes");
      const zoom = d3.zoom()
        .scaleExtent([0.28, 4])
        .on("zoom", (event) => layer.attr("transform", event.transform));
      svg.call(zoom);

      const simulationNodes = inferred.nodes.map((node) => ({ ...node }));
      const simulationEdges = inferred.edges.map((edge) => ({ ...edge }));
      const simulation = d3.forceSimulation(simulationNodes)
        .force("link", d3.forceLink(simulationEdges).id((d) => d.id).distance((d) => 42 + Math.max(0, 7 - (d.weight || 1)) * 2).strength(0.22))
        .force("charge", d3.forceManyBody().strength((d) => -65 - Math.min(170, d.degree * 9)))
        .force("collide", d3.forceCollide().radius((d) => nodeRadius(d) + 7).iterations(1))
        .force("center", d3.forceCenter(0, 0))
        .force("x", d3.forceX(0).strength(0.05))
        .force("y", d3.forceY(0).strength(0.05))
        .alphaDecay(0.08)
        .velocityDecay(0.42);

      const links = linkLayer.selectAll("line")
        .data(simulationEdges, (d) => d.id)
        .join("line")
        .attr("class", "link")
        .attr("stroke", "rgba(243, 239, 230, 0.32)")
        .attr("stroke-width", (d) => Math.max(0.65, Math.min(3.5, 0.8 + Math.sqrt(d.weight || 1) * 0.7)));

      const nodes = nodeLayer.selectAll("g")
        .data(simulationNodes, (d) => d.id)
        .join((enter) => {
          const group = enter.append("g").attr("class", "node").call(drag(simulation));
          group.append("circle")
            .attr("class", "node-dot")
            .attr("r", (d) => nodeRadius(d))
            .attr("fill", (d) => typeColor.get(d.type) || colors[0])
            .attr("stroke", (d) => typeColor.get(d.type) || colors[0])
            .attr("stroke-width", 1.1)
            .attr("stroke-opacity", 0.45);
          group.append("text")
            .attr("y", (d) => nodeRadius(d) + 10)
            .attr("text-anchor", "middle")
            .text((d) => d.label || d.id);
          return group;
        });

      function draw() {
        links
          .attr("x1", (d) => d.source.x)
          .attr("y1", (d) => d.source.y)
          .attr("x2", (d) => d.target.x)
          .attr("y2", (d) => d.target.y);
        nodes.attr("transform", (d) => `translate(${d.x},${d.y})`);
      }

      nodes
        .on("pointerenter", (event, d) => showDetails(d, true))
        .on("click", (event, d) => {
          event.stopPropagation();
          showDetails(d, true);
        });
      svg.on("click", () => {
        clearFocus();
        applyScene(activeSceneIndex, true);
      });

      simulation.stop();
      for (let i = 0; i < 180; i += 1) simulation.tick();
      draw();

      let bounds = { width: 1, height: 1 };
      let activeSceneIndex = 0;
      const resize = () => {
        const box = graphEl.getBoundingClientRect();
        bounds = { width: Math.max(320, box.width), height: Math.max(320, box.height) };
        svg.attr("viewBox", `${-bounds.width / 2} ${-bounds.height / 2} ${bounds.width} ${bounds.height}`);
        simulation.force("center", d3.forceCenter(0, 0));
      };
      new ResizeObserver(resize).observe(vizEl);
      resize();

      const scroller = scrollama();
      scroller
        .setup({
          step: ".step",
          offset: window.matchMedia("(min-width: 900px)").matches ? 0.55 : 0.72,
          debug: false,
        })
        .onStepEnter((response) => {
          const index = Number(response.element.dataset.index || 0);
          applyScene(index);
        });
      window.addEventListener("resize", scroller.resize);
      applyScene(0);

      document.getElementById("zoomIn").addEventListener("click", () => smoothZoom(1.26));
      document.getElementById("zoomOut").addEventListener("click", () => smoothZoom(0.8));
      document.getElementById("zoomReset").addEventListener("click", resetZoom);

      function nodeRadius(node) {
        return 3.6 + Math.sqrt(Math.max(0, node.degree || 0) / maxDegree) * 7.2;
      }

      function renderLegend(types, map) {
        const legend = document.getElementById("legend");
        legend.innerHTML = "";
        types.slice(0, 10).forEach((type) => {
          const item = document.createElement("div");
          item.className = "legend-item";
          const dot = document.createElement("span");
          dot.className = "legend-dot";
          dot.style.background = map.get(type);
          const label = document.createElement("span");
          label.className = "legend-label";
          label.textContent = type;
          item.append(dot, label);
          legend.appendChild(item);
        });
      }

      function renderStory(scenes) {
        storyEl.innerHTML = "";
        scenes.forEach((scene, index) => {
          const step = document.createElement("article");
          step.className = "step";
          step.dataset.index = index;
          step.style.setProperty("--accent", scene.accent);
          const nodeTotal = scene.nodeIds.length;
          const edgeTotal = scene.edgeIds.length;
          step.innerHTML = `
            <div class="step-copy">
              <p class="kicker">${escapeHtml(scene.kicker || `第 ${index + 1} 段`)}</p>
              <h2>${escapeHtml(scene.title)}</h2>
              <p>${escapeHtml(scene.body)}</p>
              <div class="scene-facts">
                <span class="fact">${nodeTotal} 个节点</span>
                <span class="fact">${edgeTotal} 条关系</span>
              </div>
            </div>
          `;
          storyEl.appendChild(step);
        });
      }

      function applyScene(index, keepStepState = false) {
        activeSceneIndex = Math.max(0, Math.min(inferred.scenes.length - 1, index));
        const scene = inferred.scenes[activeSceneIndex];
        if (!scene) return;
        const visibleNodes = new Set(scene.nodeIds);
        const visibleEdges = new Set(scene.edgeIds);
        const isCompact = bounds.width < 560;
        const labelLimit = isCompact ? 1 : 14;
        const emphNodes = new Set(scene.nodeIds.slice(0, Math.min(labelLimit, scene.nodeIds.length)));

        sceneLine.textContent = `${scene.title} - ${scene.nodeIds.length} 个节点，${scene.edgeIds.length} 条关系`;
        root.style.setProperty("--current-accent", scene.accent);

        if (!keepStepState) {
          document.querySelectorAll(".step").forEach((step, stepIndex) => {
            step.classList.toggle("is-active", stepIndex === activeSceneIndex);
          });
        }

        links
          .style("opacity", (d) => visibleEdges.has(d.id) ? 0.58 : 0)
          .attr("stroke-width", (d) => visibleEdges.has(d.id) ? Math.max(0.9, Math.min(4.2, 1 + Math.sqrt(d.weight || 1))) : 0.45);

        nodes
          .style("opacity", (d) => visibleNodes.has(d.id) ? 1 : 0.16)
          .style("pointer-events", "auto");

        nodes.select(".node-dot")
          .attr("r", (d) => {
            if (!visibleNodes.has(d.id)) return Math.max(2.2, nodeRadius(d) * 0.52);
            return emphNodes.has(d.id) ? nodeRadius(d) * 1.14 : nodeRadius(d);
          })
          .attr("stroke", (d) => emphNodes.has(d.id) ? scene.accent : (typeColor.get(d.type) || colors[0]))
          .attr("stroke-width", (d) => emphNodes.has(d.id) ? 1.8 : 1.05)
          .attr("stroke-opacity", (d) => emphNodes.has(d.id) ? 0.72 : 0.42);

        nodes.select("text")
          .style("opacity", (d) => {
            if (!visibleNodes.has(d.id)) return 0;
            if (emphNodes.has(d.id)) return 1;
            if (scene.mode === "full") return d.degree > (isCompact ? 9 : 2) ? 1 : 0;
            return isCompact ? 0 : 1;
          });

        if (!keepStepState) {
          const leadNode = scene.nodeIds.map((id) => nodeById.get(id)).filter(Boolean).sort((a, b) => (b.degree || 0) - (a.degree || 0))[0];
          if (leadNode) detailPanel.innerHTML = detailHtml(leadNode);
        }

        const centerNodes = simulationNodes.filter((node) => visibleNodes.has(node.id));
        if (centerNodes.length) {
          const cx = d3.mean(centerNodes, (d) => d.x || 0) || 0;
          const cy = d3.mean(centerNodes, (d) => d.y || 0) || 0;
          const spreadX = d3.extent(centerNodes, (d) => d.x || 0);
          const spreadY = d3.extent(centerNodes, (d) => d.y || 0);
          const w = Math.max(80, (spreadX[1] || 0) - (spreadX[0] || 0));
          const h = Math.max(80, (spreadY[1] || 0) - (spreadY[0] || 0));
          const scaleFactor = isCompact ? 0.54 : 0.66;
          const maxScale = isCompact ? 1.35 : 1.65;
          const scale = Math.max(0.38, Math.min(maxScale, scaleFactor / Math.max(w / bounds.width, h / bounds.height)));
          const transform = d3.zoomIdentity.translate(-cx * scale, -cy * scale).scale(scale);
          svg.interrupt();
          svg.transition().duration(260).ease(d3.easeCubicOut).call(zoom.transform, transform);
        }
      }

      function focusNode(node) {
        const relatedEdges = simulationEdges.filter((edge) => (edge.source.id || edge.source) === node.id || (edge.target.id || edge.target) === node.id);
        const neighbors = new Set([node.id]);
        relatedEdges.forEach((edge) => {
          neighbors.add(edge.source.id || edge.source);
          neighbors.add(edge.target.id || edge.target);
        });
        nodes.style("opacity", (d) => neighbors.has(d.id) ? 1 : 0.08);
        links
          .style("opacity", (d) => relatedEdges.includes(d) ? 0.82 : 0.025)
          .attr("stroke-width", (d) => relatedEdges.includes(d) ? 2.2 : 0.45);
        nodes.select("text").style("opacity", (d) => neighbors.has(d.id) ? 1 : 0);
      }

      function clearFocus() {
        nodes.style("opacity", null);
        links.style("opacity", null);
        nodes.select("text").style("opacity", null);
      }

      function drag(sim) {
        function dragstarted(event, d) {
          sim.on("tick", draw);
          if (!event.active) sim.alphaTarget(0.12).restart();
          d.fx = d.x;
          d.fy = d.y;
        }
        function dragged(event, d) {
          d.fx = event.x;
          d.fy = event.y;
        }
        function dragended(event, d) {
          if (!event.active) sim.alphaTarget(0);
          d.fx = null;
          d.fy = null;
          window.setTimeout(() => {
            sim.stop();
            sim.on("tick", null);
            draw();
          }, 220);
        }
        return d3.drag().on("start", dragstarted).on("drag", dragged).on("end", dragended);
      }

      function showDetails(node, shouldFocus = false) {
        detailPanel.innerHTML = detailHtml(node);
        if (shouldFocus) focusNode(node);
      }

      function detailHtml(node) {
        const description = nodeDescription(node);
        const metaPairs = compactMetaPairs(node)
          .map(([key, value]) => `<div><b>${escapeHtml(key.split(".").pop())}</b>: ${escapeHtml(metaValueText(value))}</div>`)
          .join("");
        return `
          <strong>${escapeHtml(node.label || node.id)}</strong>
          <span class="type">${escapeHtml(readableType(node.type || "实体"))} · ${node.degree || 0} 条连接</span>
          ${description ? `<div class="desc">${escapeHtml(description)}</div>` : ""}
          <div class="meta">${metaPairs || escapeHtml(node.id)}</div>
        `;
      }

      function smoothZoom(factor) {
        svg.transition().duration(220).call(zoom.scaleBy, factor);
      }

      function resetZoom() {
        svg.transition().duration(420).call(zoom.transform, d3.zoomIdentity);
      }

      function escapeHtml(value) {
        return String(value ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }
    })();
  </script>
</body>
</html>
