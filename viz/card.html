<body>
<div id="app">
  <!-- 顶栏：返回键 + 面包屑（可读关系轨迹，spec §4） -->
  <header class="topbar">
    <button id="back-btn" class="back" type="button" aria-label="返回上一步" disabled>‹</button>
    <div id="trail" class="trail" aria-label="已走过的关系轨迹"></div>
  </header>

  <main id="stage" class="stage">
    <!-- 焦点卡：当前所在节点 = 这一屏的“重点” -->
    <section id="focus" class="focus-card"></section>

    <!-- 关系类型筹码（Beef Mode 同款，spec §3/§4） -->
    <nav id="chips" class="chips" aria-label="按关系类型筛选"></nav>

    <!-- 选中某种关系时露出的一句话说明（消掉“合作 vs 同台”等脑补成本） -->
    <p id="chip-desc" class="chip-desc" hidden></p>

    <!-- 直接邻居列表（只渲染邻域，spec §2/§3） -->
    <ul id="neighbors" class="neighbors" aria-label="直接邻居"></ul>

    <p id="scent" class="scent" hidden></p>

    <!-- 颜色规则：收成可折叠，默认不占视野（降低首屏信息量） -->
    <details class="legend">
      <summary>圆点颜色 = 实体类型</summary>
      <div class="legend-items">
        <span><i style="background:var(--t-Person)"></i>人物</span>
        <span><i style="background:var(--t-Band)"></i>乐队</span>
        <span><i style="background:var(--t-Label)"></i>厂牌</span>
        <span><i style="background:var(--t-City)"></i>城市</span>
        <span><i style="background:var(--t-Venue)"></i>场地</span>
        <span><i style="background:var(--t-Event)"></i>同台</span>
      </div>
    </details>
  </main>

  <!-- 断路逃生 / 换起点 / 玩法（spec §3.1、§5、§6） -->
  <footer class="dock">
    <button id="entry-btn" class="entry-btn" type="button">🧭 换个起点 · 玩法</button>
  </footer>

  <!-- 起点 + 引导浮层（首次进入自动打开） -->
  <div id="entry-sheet" class="sheet" hidden>
    <div class="sheet-inner" id="entry-inner">
      <div class="sheet-head">
        <strong>Our Band Could Be Your Life 关系漫游</strong>
        <button id="entry-close" class="x" type="button" aria-label="关闭">✕</button>
      </div>
      <p class="sheet-lede">这不是搜索，是漫游。从一个名字出发一跳一跳地走——<b>不为找到谁，而看你能拼出一条怎样意想不到的关系链</b>。走得越远，来路越有意思。</p>
      <ol class="how">
        <li><b>点一行</b><span>跳到它身边，看它又连着谁</span></li>
        <li><b>顶部筹码</b><span>只看某一种关系</span></li>
        <li><b>顶部来路</b><span>是你走过的链，可点任意一步回看</span></li>
      </ol>
      <p class="sheet-hint">挑个起点出发：</p>
      <ul id="entry-list" class="entry-list"></ul>
      <p class="sheet-hint">或按音乐场景挑起点：</p>
      <ul id="entry-scenes" class="scene-entry-list"></ul>
    </div>
  </div>

  <!-- 场景面板（Scene）：语境层，展示边界说明 + 同场景实体（每个可作起点）。非图节点、不连边。 -->
  <div id="scene-sheet" class="sheet" hidden>
    <div class="sheet-inner" id="scene-inner">
      <div class="sheet-head">
        <strong id="scene-name"></strong>
        <button id="scene-close" class="x" type="button" aria-label="关闭">✕</button>
      </div>
      <p class="sheet-lede" id="scene-desc"></p>
      <p class="scene-meta" id="scene-meta"></p>
      <p class="sheet-hint">这个圈子里的人和乐队（点任意一个开始逛）：</p>
      <ul id="scene-list" class="entry-list"></ul>
    </div>
  </div>
</div>
